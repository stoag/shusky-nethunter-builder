name: Build Pixel 8 Pro (shusky) - NetHunter + KernelSU Next + ConfigFS
on: 
  workflow_dispatch:

jobs:  
  build-kernel:    
    runs-on: ubuntu-latest    
    env:      
      # Release Version
      CUSTOM_KERNEL_VERSION: "twk.v1.02"          
    steps:    
    - name: Free Runner Disk Space      
      run: |        
        sudo rm -rf /usr/share/dotnet        
        sudo rm -rf /usr/local/lib/android        
        sudo rm -rf /opt/ghc        
        sudo rm -rf "/usr/local/share/boost"        
        sudo apt-get clean        
        df -h    
    
    - name: Install Build Dependencies      
      run: |        
        sudo apt-get update        
        sudo apt-get install -y bc build-essential curl flex bison libssl-dev libelf-dev python3 repo git zip libncurses5-dev    
    
    - name: Configure Git Credentials      
      run: |        
        git config --global user.name "Builder"        
        git config --global user.email "builder@localhost"    
    
    - name: Cache Bazel & Kleaf Build Output      
      uses: actions/cache@v4      
      with:        
        path: |          
          ~/.cache/bazel          
          workspace/out/bazel        
        key: ${{ runner.os }}-bazel-shusky-${{ hashFiles('workspace/private/devices/google/shusky/**') }}        
        restore-keys: |          
          ${{ runner.os }}-bazel-shusky-    
    
    - name: Initialize & Sync Google Kernel Source      
      run: |        
        mkdir -p workspace        
        cd workspace                
        
        # Target the official Android 16 / Tensor G3 (shusky) branch        
        repo init -u https://android.googlesource.com/kernel/manifest -b android-gs-shusky-6.1-android16 --depth=1                
            
        # Sync required repositories to conserve runner storage        
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle        
    
    - name: Apply Kali NetHunter Subsystem Overrides      
      run: |        
        cd workspace/aosp                
        
        # Break MAC80211 LEDs natively in Kconfig to prevent core linker panics        
        find drivers/net/wireless -name "Kconfig" -exec sed -i '/select MAC80211_LEDS/d' {} +        
        sed -i 's/config MAC80211_LEDS/config MAC80211_LEDS\n\tdepends on BROKEN/g' net/mac80211/Kconfig    
    
    - name: Inject Android-Optimized RTL8812AU Driver      
      run: |        
        cd workspace/aosp                
        
        # 1. Unlock the upstream Realtek Makefile        
        chmod u+w drivers/net/wireless/realtek/Makefile                
        
        # 2. Clone the repository into a temporary staging directory        
        git clone https://github.com/ShorterKing/RTL88x2BU-Android-Drivers_rtl8812au.git /tmp/rtl_repo                
        
        # 3. Extract ONLY the rtl8812au subdirectory into our kernel's realtek tree        
        mv /tmp/rtl_repo/rtl8812au drivers/net/wireless/realtek/rtl8812au        
        rm -rf /tmp/rtl_repo                
        
        # 4. Hook the specific subdirectory natively into the upstream Kbuild system        
        echo 'obj-m += rtl8812au/' >> drivers/net/wireless/realtek/Makefile        
        sed -i 's/obj-\$(CONFIG_88XXAU)/obj-m/g' drivers/net/wireless/realtek/rtl8812au/Makefile                
        
        # 5. FORCE compilation and suppress strict Clang 18 cast/pointer warnings completely
        {
          echo 'EXTRA_CFLAGS += -Wno-error'
          echo 'EXTRA_CFLAGS += -Wno-cast-function-type'
          echo 'EXTRA_CFLAGS += -Wno-incompatible-pointer-types'
          echo 'ccflags-y += -Wno-error'
          echo 'ccflags-y += -Wno-cast-function-type'
          echo 'ccflags-y += -Wno-incompatible-pointer-types'
        } >> drivers/net/wireless/realtek/rtl8812au/Makefile               
        
        # 6. GKI PREBUILT BYPASS: Stub restricted File I/O functions using compile-time macros        
        {
          echo 'EXTRA_CFLAGS += -Dfilp_open=filp_open_dummy'
          echo 'EXTRA_CFLAGS += -Dkernel_read=kernel_read_dummy'
          echo 'EXTRA_CFLAGS += -Dkernel_write=kernel_write_dummy'
        } >> drivers/net/wireless/realtek/rtl8812au/Makefile                
        
        # Inject the dummy fallback functions directly into the driver's OS dependency file        
        OSDEP_FILE=$(find drivers/net/wireless/realtek/rtl8812au -name "osdep_service.c" | head -n 1)        
        {
          echo '/* GKI PREBUILT BYPASS - STUB FILE I/O */'
          echo '#include <linux/fs.h>'
          echo '#include <linux/err.h>'
          echo '#include <linux/errno.h>'
          echo 'struct file *filp_open_dummy(const char *filename, int flags, umode_t mode) {'
          echo '    return ERR_PTR(-ENOENT);'
          echo '}'
          echo 'ssize_t kernel_read_dummy(struct file *file, void *buf, size_t count, loff_t *pos) {'
          echo '    return -EIO;'
          echo '}'
          echo 'ssize_t kernel_write_dummy(struct file *file, const void *buf, size_t count, loff_t *pos) {'
          echo '    return -EIO;'
          echo '}'
        } >> "$OSDEP_FILE"                
        
        # 7. Apply deterministic Python patch for Linux 6.1 cfg80211 API changes
        {
          echo 'import sys'
          echo 'path = "drivers/net/wireless/realtek/rtl8812au/os_dep/linux/ioctl_cfg80211.c"'
          echo 'with open(path, "r") as f:'
          echo '    code = f.read()'
          echo 'target1 = "cfg80211_ch_switch_started_notify(adapter->pnetdev, &chdef, 0, 0, false);"'
          echo 'replacement1 = "cfg80211_ch_switch_started_notify(adapter->pnetdev, &chdef, 0, 0, false, 0);"'
          echo 'target2 = "cfg80211_ch_switch_notify(adapter->pnetdev, &chdef, 0);"'
          echo 'replacement2 = "cfg80211_ch_switch_notify(adapter->pnetdev, &chdef, 0, 0);"'
          echo 'code = code.replace(target1, replacement1)'
          echo 'code = code.replace(target2, replacement2)'
          echo 'with open(path, "w") as f:'
          echo '    f.write(code)'
        } > patch_cfg80211.py
        python3 patch_cfg80211.py
    
    - name: Apply KernelSU Next Patches & Configs      
      run: |        
        cd workspace/aosp                
        
        # 1. Inject KernelSU Next inline source code        
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -                
        
        # Temporarily commented out to prevent "KMI or sublevel mismatch" panics
        # echo 'CONFIG_LOCALVERSION="-${{ env.CUSTOM_KERNEL_VERSION }}"' >> arch/arm64/configs/gki_defconfig
        
        # 2. Append configs cleanly
        {
          echo '# Inline KernelSU Next'
          echo 'CONFIG_KSU=y'
          echo 'CONFIG_TRIM_NONLISTED_KMI=n'
          echo '# USB ConfigFS & HID Arsenal'
          echo 'CONFIG_CONFIGFS_FS=y'
          echo 'CONFIG_USB_CONFIGFS=y'
          echo 'CONFIG_USB_GADGETFS=y'
          echo 'CONFIG_USB_CONFIGFS_F_HID=y'
          echo 'CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y'
          echo 'CONFIG_USB_CONFIGFS_F_ECM=y'
          echo 'CONFIG_USB_CONFIGFS_F_ACM=y'
          echo 'CONFIG_USB_CONFIGFS_RNDIS=y'
          echo 'CONFIG_USB_CONFIGFS_NCM=y'
          echo '# Bridging & Netlink Hooks'
          echo 'CONFIG_BRIDGE=y'
          echo 'CONFIG_BRIDGE_NETFILTER=y'
          echo 'CONFIG_NETFILTER_NETLINK_LOG=y'
          echo 'CONFIG_NETFILTER_NETLINK_QUEUE=y'
          echo '# Logging & User-Space Queueing'
          echo 'CONFIG_NETFILTER_XT_TARGET_LOG=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_NFLOG=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y'
          echo '# Iptables Matching & Stateful Inspection'
          echo 'CONFIG_NETFILTER_XT_MATCH_OWNER=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_STATE=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_MARK=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_MARK=y'
          echo '# NAT & Packet Mangling'
          echo 'CONFIG_IP_NF_NAT=y'
          echo 'CONFIG_IP6_NF_NAT=y'
          echo 'CONFIG_IP_NF_MANGLE=y'
          echo 'CONFIG_IP6_NF_MANGLE=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y'
          echo '# Wireless Subsystem'
          echo 'CONFIG_CFG80211=y'
          
          echo '# --- NETHUNTER EXTERNAL WI-FI ADAPTER MASTER LIST ---'
          echo 'CONFIG_WLAN_VENDOR_REALTEK=y'
          echo '# (Commented out specific in-tree modules for now to bypass linking errors)'
          echo '# CONFIG_WLAN_VENDOR_ATH=y'
          echo '# CONFIG_ATH9K_HTC=m'
          echo '# CONFIG_RTL8187=m'
          echo '# CONFIG_RTL8XXXU=m'
          echo '# CONFIG_WLAN_VENDOR_MEDIATEK=y'
          echo '# CONFIG_MT7601U=m'
          echo '# CONFIG_MT76x0U=m'
          echo '# CONFIG_MT76x2U=m'
          echo '# CONFIG_MT7921U=m'
          echo '# CONFIG_WLAN_VENDOR_INTEL=y'
          echo '# CONFIG_IWLDVM=m'
          echo '# CONFIG_IWLMVM=m'
          echo '# ----------------------------------------------------'

          echo '# Bluetooth & VPN Support'
          echo 'CONFIG_BT_HCIBTUSB=m'
          echo 'CONFIG_WIREGUARD=y'
          echo '# CPU Governors & BBR TCP'
          echo 'CONFIG_CPU_FREQ_GOV_PERFORMANCE=y'
          echo 'CONFIG_CPU_FREQ_GOV_POWERSAVE=y'
          echo 'CONFIG_CPU_FREQ_GOV_USERSPACE=y'
          echo 'CONFIG_CPU_FREQ_GOV_ONDEMAND=y'
          echo 'CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y'
          echo 'CONFIG_TCP_CONG_BBR=y'
          echo 'CONFIG_NET_SCH_FQ=y'
          echo 'CONFIG_DEFAULT_BBR=y'
          echo '# TTL Modification Support'
          echo 'CONFIG_NETFILTER_XT_TARGET_HL=y'
          echo 'CONFIG_IP_NF_TARGET_TTL=y'
          echo 'CONFIG_IP6_NF_TARGET_HL=y'
        } >> arch/arm64/configs/gki_defconfig    

    - name: Authorize NetHunter Symbols in GKI
      run: |
        cd workspace
        echo "Symbol authorization safely bypassed for now."

    - name: Track New Modules in Bazel
      run: |
        cd workspace/aosp
        
        # Download buildozer (Bazel file editor)
        wget -qO buildozer https://github.com/bazelbuild/buildtools/releases/latest/download/buildozer-linux-amd64
        chmod +x buildozer
        
        # Track the Realtek driver AND the Bluetooth modules built via Kconfig
        ./buildozer 'add module_outs drivers/net/wireless/realtek/rtl8812au/88XXau.ko drivers/bluetooth/btintel.ko drivers/bluetooth/btusb.ko drivers/bluetooth/btrtl.ko' //private/devices/google/shusky:kernel
        
    - name: Compile Pixel 8 Pro Kernel via Bazel      
      run: |        
        cd workspace        
        BUILD_AOSP_KERNEL=1 EXTRA_ARGS="--notrim_nonlisted_kmi --nokmi_symbol_list_strict_mode" ./build_shusky.sh    
    
    - name: Package Kernel and Silent Driver Injector      
      run: |        
        cd workspace                
        
        # Clone your custom Sultan-based AK3 template        
        git clone https://github.com/stoag/AnyKernel3-Pixel8Pro.git AnyKernel3                
        
        # Inject standard binaries        
        wget -qO AnyKernel3/tools/busybox https://raw.githubusercontent.com/xerta555/Busybox-Binaries/master/busybox-arm64        
        chmod +x AnyKernel3/tools/busybox        
        wget -qO magisk.zip https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk        
        unzip -j magisk.zip lib/arm64-v8a/libmagiskboot.so        
        mv libmagiskboot.so AnyKernel3/tools/magiskboot        
        chmod +x AnyKernel3/tools/magiskboot        
        rm magisk.zip                
        
        # Move the compiled kernel into the AK3 folder        
        cp out/shusky/dist/Image.lz4 AnyKernel3/                
        
        # THE TROJAN HORSE: Move drivers into a hidden AK3 folder        
        mkdir -p AnyKernel3/twk_drivers        
        
        # Target our specific adapter driver from the official GKI dist output
        find out/shusky/dist -name "88XXau.ko" -exec cp {} AnyKernel3/twk_drivers/ \;
        
        # Verification check - Prints contents to the Actions Log so you can verify it copied
        echo "VERIFYING DRIVER EXTRACTION:"
        ls -la AnyKernel3/twk_drivers/
        
        # Update the version string        
        sed -i "s/kernel.string=.*/kernel.string=Tweaker Kernel (${{ env.CUSTOM_KERNEL_VERSION }})/g" AnyKernel3/anykernel.sh                
        
        # Append the Silent Injection script to the bottom of anykernel.sh        
        {\n          echo '# --- TWEAKER KERNEL SILENT DRIVER INJECTION ---'\n          echo 'ui_print \" \";'\n          echo 'ui_print \"- Injecting NetHunter Wi-Fi Drivers safely into system overlay...\";'\n          echo 'mount /data;'\n          echo 'MOD_DIR=\"/data/adb/modules/twk_nethunter_drivers\"'\n          echo 'rm -rf $MOD_DIR'\n          echo 'mkdir -p $MOD_DIR/system/vendor/lib/modules'\n          echo 'cp -f $home/twk_drivers/*.ko $MOD_DIR/system/vendor/lib/modules/'\n          echo 'echo \"id=twk_nethunter_drivers\" > $MOD_DIR/module.prop'\n          echo 'echo \"name=Tweaker Kernel NetHunter Drivers\" >> $MOD_DIR/module.prop'\n          echo 'echo \"version=${{ env.CUSTOM_KERNEL_VERSION }}\" >> $MOD_DIR/module.prop'\n          echo 'echo \"versionCode=102\" >> $MOD_DIR/module.prop'\n          echo 'echo \"author=Tweaker\" >> $MOD_DIR/module.prop'\n          echo 'echo \"description=Auto-injected driver overlay for Kali NetHunter.\" >> $MOD_DIR/module.prop'\n          echo 'echo \"#!/system/bin/sh\" > $MOD_DIR/service.sh'\n          \n          # Dynamically load the driver we copied into the KernelSU directory\n          echo 'echo \"insmod $MOD_DIR/system/vendor/lib/modules/88XXau.ko\" >> $MOD_DIR/service.sh'\n          \n          echo 'chmod +x $MOD_DIR/service.sh'\n          echo 'ui_print \"- Drivers integrated successfully!\";'\n          echo '# ----------------------------------------------'\n        } >> AnyKernel3/anykernel.sh                
        
        cd AnyKernel3        
        zip -r9 ../Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-AK3-Boot.zip * -x README.md        
        cd ..    
    
    - name: Upload Single Kernel Release Zip      
      uses: actions/upload-artifact@v4      
      with:        
        name: Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-Release        
        path: workspace/*AK3-Boot.zip        
        if-no-files-found: error

    - name: Ping Phone - Success
      if: success()
      run: curl -d "✅ Pixel 8 Pro Kernel Build COMPLETE! Wake up and grab the ZIP!" https://ntfy.sh/twk_pixel8_build_alerts

    - name: Ping Phone - Failure
      if: failure()
      run: curl -d "❌ Pixel 8 Pro Kernel Build FAILED! Check the logs." https://ntfy.sh/twk_pixel8_build_alerts
