- name: Package Kernel, Firmware, Drivers, and Partitions into Flat Bundle
        run: |
          cd workspace
          mkdir -p bundle
          
          git clone https://github.com/stoag/AnyKernel3-Pixel8Pro.git AnyKernel3
          
          wget -qO AnyKernel3/tools/busybox https://raw.githubusercontent.com/xerta555/Busybox-Binaries/master/busybox-arm64
          chmod +x AnyKernel3/tools/busybox
          wget -qO magisk.zip https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -j magisk.zip lib/arm64-v8a/libmagiskboot.so
          mv libmagiskboot.so AnyKernel3/tools/magiskboot
          chmod +x AnyKernel3/tools/magiskboot
          rm magisk.zip
          
          cp out/shusky/dist/Image.lz4 AnyKernel3/
          
          # Fetch Official Linux Firmware for MT7612U
          mkdir -p AnyKernel3/twk_firmware/mediatek
          curl -L "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662u.bin" -o AnyKernel3/twk_firmware/mediatek/mt7662u.bin
          curl -L "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662u_rom_patch.bin" -o AnyKernel3/twk_firmware/mediatek/mt7662u_rom_patch.bin
          
          # Copy Realtek driver AND MediaTek modular stack
          mkdir -p AnyKernel3/twk_drivers
          find out/shusky/dist -name "8812au.ko" -exec cp {} AnyKernel3/twk_drivers/ \;
          find out/shusky/dist -name "mt76*.ko" -exec cp {} AnyKernel3/twk_drivers/ \;
          
          sed -i "s/kernel.string=.*/kernel.string=Tweaker Kernel (v${{ env.CUSTOM_KERNEL_VERSION }})/g" AnyKernel3/anykernel.sh
          
          {
            echo '# --- TWEAKER KERNEL HYBRID INJECTION ---'
            echo 'ui_print " ";'
            echo 'ui_print "- Injecting Mediatek Firmware & Adapter Drivers...";'
            echo 'mount /data;'
            echo 'MOD_DIR="/data/adb/modules/twk_nethunter_adapters"'
            echo 'rm -rf $MOD_DIR'
            echo 'mkdir -p $MOD_DIR/system/vendor/firmware'
            echo 'cp -rf $home/twk_firmware/* $MOD_DIR/system/vendor/firmware/'
            echo 'mkdir -p $MOD_DIR/system/vendor/lib/modules'
            echo 'cp -f $home/twk_drivers/*.ko $MOD_DIR/system/vendor/lib/modules/'
            echo 'echo "id=twk_nethunter_adapters" > $MOD_DIR/module.prop'
            echo 'echo "name=Tweaker Kernel Hybrid Adapters" >> $MOD_DIR/module.prop'
            echo 'echo "version=v${{ env.CUSTOM_KERNEL_VERSION }}" >> $MOD_DIR/module.prop'
            echo 'echo "versionCode=120" >> $MOD_DIR/module.prop'
            echo 'echo "author=Tweaker" >> $MOD_DIR/module.prop'
            echo 'echo "description=Injects MT76 firmware for Panda adapters & modular drivers for Realtek/MTK." >> $MOD_DIR/module.prop'
            echo 'echo "#!/system/bin/sh" > $MOD_DIR/service.sh'
            echo 'echo "insmod $MOD_DIR/system/vendor/lib/modules/mt76.ko" >> $MOD_DIR/service.sh'
            echo 'echo "insmod $MOD_DIR/system/vendor/lib/modules/mt76-usb.ko" >> $MOD_DIR/service.sh'
            echo 'echo "insmod $MOD_DIR/system/vendor/lib/modules/mt76x02-lib.ko" >> $MOD_DIR/service.sh'
            echo 'echo "insmod $MOD_DIR/system/vendor/lib/modules/mt76x02-usb.ko" >> $MOD_DIR/service.sh'
            echo 'echo "insmod $MOD_DIR/system/vendor/lib/modules/mt76x2-common.ko" >> $MOD_DIR/service.sh'
            echo 'echo "insmod $MOD_DIR/system/vendor/lib/modules/mt76x2u.ko" >> $MOD_DIR/service.sh'
            echo 'echo "insmod $MOD_DIR/system/vendor/lib/modules/8812au.ko rtw_drv_log_level=6 rtw_power_mgnt=0 rtw_switch_usb_mode=0" >> $MOD_DIR/service.sh'
            echo 'chmod +x $MOD_DIR/service.sh'
            echo 'ui_print "- Dual Adapter support integrated successfully!";'
          } >> AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-anykernel3.zip * -x README.md
          cd ..

          # Broaden the search to grab boot/init images regardless of exact naming variations in shusky dist
          find out/ -type f \( -name "init_boot.img" -o -name "boot.img" \) -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-init_boot.img \;
          find out/ -type f -name "vendor_dlkm.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-vendor_dlkm.img \;
          find out/ -type f -name "vendor_kernel_boot.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-vendor_kernel_boot.img \;
          find out/ -type f -name "system_dlkm.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-system_dlkm.img \;

          echo "VERIFYING BUNDLE CONTENTS:"
          ls -lh bundle/
