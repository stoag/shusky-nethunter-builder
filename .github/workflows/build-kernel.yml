name: Build Pixel 8 Pro Tweakers Paradise - NetHunter + KernelSU Next + ConfigFS

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free Runner Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential curl flex bison libssl-dev \
          libelf-dev python3 repo git zip libncurses5-dev

    - name: Configure Git Credentials
      run: |
        git config --global user.name "Builder"
        git config --global user.email "builder@localhost"

    - name: Initialize & Sync Google Kernel Source
      run: |
        mkdir workspace && cd workspace
        # Target the official Android 16 / Tensor G3 (shusky) branch
        repo init -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 --depth=1
        
        # Sync only what is necessary to conserve storage and bandwidth
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    - name: Apply Kali NetHunter Drivers & Patches
      run: |
        cd workspace/aosp # Main GKI Linux kernel tree
        
        # Download and apply Kali mac80211 Wi-Fi injection & HID patches
        curl -s https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project/-/raw/master/patches/6.1/0001-mac80211-injection.patch | git apply || true
        curl -s https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project/-/raw/master/patches/6.1/0002-hid-gadget.patch | git apply || true

    - name: Apply KernelSU Next Patches
      run: |
        cd workspace/aosp
        
        # 1. Install KernelSU Next (Default Next Branch)
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        
        # 2. Fix ABI symbol exports for Android 14+ GKI to ensure Wi-Fi modules work
        rm -f android/abi_gki_protected_exports_aarch64
        rm -f android/abi_gki_protected_exports_x86_64

        # 3. Enable KSU, ConfigFS, and Modular Wi-Fi Drivers
        cat << 'EOF' >> arch/arm64/configs/gki_defconfig
        # KSU
        CONFIG_KSU=y

        # USB Arsenal & HID
        CONFIG_CONFIGFS_FS=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_GADGETFS=y
        CONFIG_USB_CONFIGFS_F_HID=y
        CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
        CONFIG_USB_CONFIGFS_F_ECM=y
        CONFIG_USB_CONFIGFS_F_ACM=y

        # Mac80211 Subsystem (Required for Injection)
        CONFIG_MAC80211=y
        CONFIG_MAC80211_RC_MINSTREL=y
        CONFIG_MAC80211_RC_MINSTREL_HT=y
        CONFIG_MAC80211_RC_MINSTREL_VHT=y
        CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
        CONFIG_MAC80211_MESH=y
        CONFIG_CFG80211=y

        # FIX: Explicitly disable Wi-Fi LED triggers so the compiler stops looking for them!
        # CONFIG_MAC80211_LEDS is not set
        # CONFIG_ATH9K_HTC_LEDS is not set
        # CONFIG_RTL8187_LEDS is not set

        # External Wi-Fi Adapters (Atheros & Realtek Enabled)
        CONFIG_WLAN_VENDOR_ATH=y
        CONFIG_ATH9K_HTC=m
        CONFIG_WLAN_VENDOR_REALTEK=y
        CONFIG_RTL8187=m
        
        # External BT & Networking
        CONFIG_BT_HCIBTUSB=m
        CONFIG_WIREGUARD=y
        
        # CPU Frequency Governors (Allows manual overriding of CPU scaling)
        CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
        CONFIG_CPU_FREQ_GOV_POWERSAVE=y
        CONFIG_CPU_FREQ_GOV_USERSPACE=y
        CONFIG_CPU_FREQ_GOV_ONDEMAND=y
        CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y

        # Advanced Power Supply & Thermal Debugging (Required for FKM/EXKM)
        CONFIG_POWER_SUPPLY_DEBUG=y
        CONFIG_DEBUG_FS=y
        CONFIG_THERMAL_GOV_USER_SPACE=y

        # BBR TCP Congestion Control (Faster mobile data throughput)
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_DEFAULT_BBR=y

        # TTL Modification (Hotspot throttle bypassing)
        CONFIG_NETFILTER_XT_TARGET_HL=y
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y

        # Native High-Capacity Drive Support
        CONFIG_NTFS3_FS=y
        CONFIG_EXFAT_FS=y
        CONFIG_ISO9660_FS=y
        CONFIG_UDF_FS=y
        EOF

    - name: Compile Pixel 8 Pro Kernel
      run: |
         cd workspace
         # Android 16 (6.1) uses Kleaf/Bazel via a device-specific wrapper script
         BUILD_AOSP_KERNEL=1 ./build_shusky.sh

    - name: Package into AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        
        # In the 6.1 Kleaf tree, the output path is out/shusky/dist/
        cp workspace/out/shusky/dist/Image.lz4 AnyKernel3/
        mkdir -p AnyKernel3/modules/vendor/lib/modules
        cp workspace/out/shusky/dist/*.ko AnyKernel3/modules/vendor/lib/modules/ || true
        
        # Configure AnyKernel for shusky
        sed -i 's/device.name1=/device.name1=husky/g' AnyKernel3/anykernel.sh
        sed -i 's/device.name2=/device.name2=shiba/g' AnyKernel3/anykernel.sh
        sed -i 's/BLOCK=auto/BLOCK=boot/g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/g' AnyKernel3/anykernel.sh

        cd AnyKernel3
        zip -r9 ../Custom-Shusky-NetHunter-Kernel.zip * -x .git README.md

    - name: Upload Flashable ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Shusky-Kernel
        path: Custom-Shusky-NetHunter-Kernel.zip
