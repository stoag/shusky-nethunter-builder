name: Build Pixel 8 Pro (shusky) - NetHunter + KernelSU Next + ConfigFS

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      # Release Version
      CUSTOM_KERNEL_VERSION: "twk.v1.02"
      
    steps:
    - name: Free Runner Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential curl flex bison libssl-dev \
          libelf-dev python3 repo git zip libncurses5-dev

    - name: Configure Git Credentials
      run: |
        git config --global user.name "Builder"
        git config --global user.email "builder@localhost"

    - name: Cache Bazel & Kleaf Build Output
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          workspace/out/bazel
        key: ${{ runner.os }}-bazel-shusky-${{ hashFiles('workspace/private/devices/google/shusky/**') }}
        restore-keys: |
          ${{ runner.os }}-bazel-shusky-

    - name: Initialize & Sync Google Kernel Source
      run: |
        mkdir -p workspace
        cd workspace
        
        # Target the official Android 16 / Tensor G3 (shusky) branch
        repo init -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 --depth=1
        
        # Sync required repositories to conserve runner storage
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle
    
    - name: Apply Kali NetHunter Subsystem Overrides
      run: |
        cd workspace/aosp
        
        # Break MAC80211 LEDs natively in Kconfig to prevent core linker panics
        find drivers/net/wireless -name "Kconfig" -exec sed -i '/select MAC80211_LEDS/d' {} +
        sed -i 's/config MAC80211_LEDS/config MAC80211_LEDS\n\tdepends on BROKEN/g' net/mac80211/Kconfig

    - name: Inject Android-Optimized RTL8812AU Driver
      run: |
        cd workspace/aosp
        
        # 1. Unlock the upstream Realtek Makefile
        chmod u+w drivers/net/wireless/realtek/Makefile
        
        # 2. Clone the repository into a temporary staging directory
        git clone https://github.com/ShorterKing/RTL88x2BU-Android-Drivers_rtl8812au.git /tmp/rtl_repo
        
        # 3. Extract ONLY the rtl8812au subdirectory into our kernel's realtek tree
        mv /tmp/rtl_repo/rtl8812au drivers/net/wireless/realtek/rtl8812au
        rm -rf /tmp/rtl_repo
        
        # 4. Hook the specific subdirectory natively into the upstream Kbuild system
        echo 'obj-m += rtl8812au/' >> drivers/net/wireless/realtek/Makefile
        sed -i 's/obj-\$(CONFIG_88XXAU)/obj-m/g' drivers/net/wireless/realtek/rtl8812au/Makefile
        
        # 5. FORCE compilation and use EXTRA_CFLAGS to inherit warning suppressions
        echo "EXTRA_CFLAGS += -Wno-uninitialized -Wno-attribute-warning -Wno-error -Wno-cast-function-type" >> drivers/net/wireless/realtek/rtl8812au/Makefile
        
        # 6. GKI PREBUILT BYPASS: Stub restricted File I/O functions using compile-time macros
        echo "EXTRA_CFLAGS += -Dfilp_open=filp_open_dummy -Dkernel_read=kernel_read_dummy -Dkernel_write=kernel_write_dummy" >> drivers/net/wireless/realtek/rtl8812au/Makefile
        
        # Inject the dummy fallback functions directly into the driver's OS dependency file
        OSDEP_FILE=$(find drivers/net/wireless/realtek/rtl8812au -name "osdep_service.c" | head -n 1)
        cat << 'EOF' >> "$OSDEP_FILE"
        
        /* GKI PREBUILT BYPASS - STUB FILE I/O */
        #include <linux/fs.h>
        #include <linux/err.h>
        #include <linux/errno.h>
        struct file *filp_open_dummy(const char *filename, int flags, umode_t mode) {
            return ERR_PTR(-ENOENT);
        }
        ssize_t kernel_read_dummy(struct file *file, void *buf, size_t count, loff_t *pos) {
            return -EIO;
        }
        ssize_t kernel_write_dummy(struct file *file, const void *buf, size_t count, loff_t *pos) {
            return -EIO;
        }
        EOF
        
        # 7. Apply deterministic Python patch for Linux 6.1 cfg80211 API changes
        python3 -c '
        path = "drivers/net/wireless/realtek/rtl8812au/os_dep/linux/ioctl_cfg80211.c"
        with open(path, "r") as f:
            code = f.read()

        target1 = "cfg80211_ch_switch_started_notify(adapter->pnetdev, &chdef, 0, 0, false);"
        replacement1 = "cfg80211_ch_switch_started_notify(adapter->pnetdev, &chdef, 0, 0, false, 0);"

        target2 = "cfg80211_ch_switch_notify(adapter->pnetdev, &chdef, 0);"
        replacement2 = "cfg80211_ch_switch_notify(adapter->pnetdev, &chdef, 0, 0);"

        if target1 in code:
            code = code.replace(target1, replacement1)
        if target2 in code:
            code = code.replace(target2, replacement2)

        with open(path, "w") as f:
            f
