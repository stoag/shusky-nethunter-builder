name: Build Pixel 8 Pro (shusky) - NetHunter + KernelSU-Next

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:  
  build-kernel:    
    runs-on: ubuntu-24.04    
    env:      
      # Release Version
      CUSTOM_KERNEL_VERSION: "1.24"          
    steps:    
    - name: Free Runner Disk Space      
      run: |        
        sudo rm -rf /usr/share/dotnet        
        sudo rm -rf /usr/local/lib/android        
        sudo rm -rf /opt/ghc        
        sudo rm -rf "/usr/local/share/boost"        
        sudo apt-get clean        
        df -h    
    
    - name: Install Build Dependencies      
      run: |        
        sudo apt-get update        
        sudo apt-get install -y bc build-essential curl flex bison libssl-dev libelf-dev python3 repo git zip libncurses5-dev    
    
    - name: Configure Git Credentials      
      run: |        
        git config --global user.name "Builder"        
        git config --global user.email "builder@localhost"    
    
    - name: Cache Bazel & Kleaf Build Output      
      uses: actions/cache@v4      
      with:        
        path: |          
          ~/.cache/bazel          
          workspace/out/bazel        
        key: ${{ runner.os }}-bazel-shusky-${{ hashFiles('workspace/private/devices/google/shusky/**') }}        
        restore-keys: |          
          ${{ runner.os }}-bazel-shusky-    
    
    - name: Initialize & Sync Google Kernel Source      
      run: |        
        mkdir -p workspace        
        cd workspace                
        
        repo init -u https://android.googlesource.com/kernel/manifest -b android-gs-shusky-6.1-android16 --depth=1                
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle        

    - name: Patch Wireless Configs (Prevent MAC80211 LED Linker Panics)
      run: |
        cd workspace/aosp
        chmod u+w net/mac80211/Kconfig
        find drivers/net/wireless -name "Kconfig" -exec chmod u+w {} +
        find drivers/net/wireless -name "Kconfig" -exec sed -i '/select MAC80211_LEDS/d' {} +
        sed -i 's/config MAC80211_LEDS/config MAC80211_LEDS\n\tdepends on BROKEN/g' net/mac80211/Kconfig
    
    - name: Inject Morrownr Linux 6.1-Ready Driver (8812AU)
      run: |        
        cd workspace/aosp                
        
        chmod u+w drivers/net/wireless/realtek/Makefile                
        rm -rf drivers/net/wireless/realtek/rtw88 drivers/net/wireless/realtek/rtl8812au
        
        mkdir -p drivers/net/wireless/realtek/rtw88
        touch drivers/net/wireless/realtek/rtw88/Kconfig
        
        git clone https://github.com/stoag/8812au-20210820.git drivers/net/wireless/realtek/rtl8812au                
        rm -rf drivers/net/wireless/realtek/rtl8812au/.git                
        
        sed -i 's/CONFIG_RTW_NAPI = y/CONFIG_RTW_NAPI = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile
        sed -i 's/CONFIG_RTW_GRO = y/CONFIG_RTW_GRO = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile
        sed -i 's/CONFIG_RTW_NETIF_SG = y/CONFIG_RTW_NETIF_SG = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile
        sed -i 's/CONFIG_LOAD_PHY_PARA_FROM_FILE = y/CONFIG_LOAD_PHY_PARA_FROM_FILE = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile
        
        # Strictly disable Concurrent Mode to prevent the kali1 runtime crash on the 8812AU
        sed -i 's/ccflags-y += -DCONFIG_CONCURRENT_MODE/#ccflags-y += -DCONFIG_CONCURRENT_MODE/g' drivers/net/wireless/realtek/rtl8812au/Makefile
        
        echo 'ccflags-y += -DCONFIG_USE_USB_BUFFER_ALLOC_TX -DCONFIG_USE_USB_BUFFER_ALLOC_RX -Wno-switch-bool -Wno-parentheses-equality' >> drivers/net/wireless/realtek/rtl8812au/Makefile
        echo 'obj-y += rtl8812au/' >> drivers/net/wireless/realtek/Makefile                
        echo 'obj-m := $(MODULE_NAME).o' >> drivers/net/wireless/realtek/rtl8812au/Makefile

    - name: Apply KernelSU Next & NetHunter Configs      
      run: |        
        cd workspace/aosp                
        
        # 1. Inject KernelSU Next Inline Source Code        
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -                
        
        # 2. Pin KernelSU-Next version metadata (KSU_GIT_VERSION_VALID=1 prevents sandbox fallback)
        if [ -d "KernelSU-Next" ]; then
          KSUN_TAG=$(git -C KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo "v3.4.2")
          KSUN_GIT_VERSION=$(git -C KernelSU-Next rev-list --count HEAD 2>/dev/null || echo "33355")
          for ksu_file in KernelSU-Next/kernel/Kbuild KernelSU-Next/kernel/Makefile; do
            if [ -f "$ksu_file" ]; then
              chmod u+w "$ksu_file"
              sed -i "1i # CI-pinned KernelSU-Next metadata\nKSU_GIT_VERSION := $KSUN_GIT_VERSION\nKSU_GIT_TAG := $KSUN_TAG\nKSU_VERSION_TAG := $KSUN_TAG\nKSU_GIT_VERSION_VALID := 1\n" "$ksu_file"
            fi
          done
        fi

        # 3. Append Configs (NetHunter, MT76, 8812AU, KSU)
        chmod u+w arch/arm64/configs/gki_defconfig
        {
          echo '# Custom Kernel Signature'
          echo 'CONFIG_LOCALVERSION="-twk.v${{ env.CUSTOM_KERNEL_VERSION }}"'

          echo '# Core Wireless Subsystems'
          echo 'CONFIG_CFG80211=y'
          echo 'CONFIG_MAC80211=y'
          echo 'CONFIG_CFG80211_CERTIFICATION_ONUS=y'
          echo 'CONFIG_WIRELESS=y'
          
          echo '# MODULE: MediaTek MT7612U (Panda PAU0D)'
          echo 'CONFIG_WLAN_VENDOR_MEDIATEK=y'
          echo 'CONFIG_MT76_CORE=m'
          echo 'CONFIG_MT76_LEDS=n'
          echo 'CONFIG_MT76_USB=m'
          echo 'CONFIG_MT76x02_LIB=m'
          echo 'CONFIG_MT76x02_USB=m'
          echo 'CONFIG_MT76x2_COMMON=m'
          echo 'CONFIG_MT76x2U=m'
          
          echo '# MODULE: Realtek RTL8812AU'
          echo 'CONFIG_WLAN_VENDOR_REALTEK=y'
          echo 'CONFIG_RTW88=n'
          echo 'CONFIG_RTW88_CORE=n'
          echo 'CONFIG_RTW88_USB=n'
          echo 'CONFIG_RTL8812AU=m'

          echo '# Inline KernelSU Next'
          echo 'CONFIG_KSU=y'
          echo 'CONFIG_TRIM_NONLISTED_KMI=n'
          
          echo '# USB ConfigFS & HID Arsenal'
          echo 'CONFIG_CONFIGFS_FS=y'
          echo 'CONFIG_USB_CONFIGFS=y'
          echo 'CONFIG_USB_GADGETFS=y'
          echo 'CONFIG_USB_CONFIGFS_F_HID=y'
          echo 'CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y'
          echo 'CONFIG_USB_CONFIGFS_F_ECM=y'
          echo 'CONFIG_USB_CONFIGFS_F_ACM=y'
          echo 'CONFIG_USB_CONFIGFS_RNDIS=y'
          echo 'CONFIG_USB_CONFIGFS_NCM=y'
          
          echo '# AFWall+ & Netfilter Logging'
          echo 'CONFIG_NETFILTER_NETLINK_LOG=y'
          echo 'CONFIG_NETFILTER_NETLINK_QUEUE=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_LOG=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_NFLOG=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_OWNER=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_STATE=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_MARK=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_MARK=y'
          
          echo '# NAT & WireGuard'
          echo 'CONFIG_IP_NF_NAT=y'
          echo 'CONFIG_IP6_NF_NAT=y'
          echo 'CONFIG_IP_NF_MANGLE=y'
          echo 'CONFIG_IP6_NF_MANGLE=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y'
          echo 'CONFIG_WIREGUARD=y'
          
          echo 'CONFIG_BT_HCIBTUSB=m'
        } >> arch/arm64/configs/gki_defconfig

        # 4. Disable POST_DEFCONFIG_CMDS="check_defconfig" in aosp/build.config.gki
        chmod u+w build.config.gki
        echo "DEFCONFIG=gki_defconfig" > build.config.gki

    - name: Authorize NetHunter Symbols in GKI
      run: |
        cd workspace
        
        {
          echo '_bcd2bin'
          echo '__dev_kfree_skb_irq'
          echo '__hci_cmd_sync'
          echo '__hci_cmd_sync_ev'
          echo '__ioread32_copy'
          echo '__iowrite32_copy'
          echo '__printk_ratelimit'
          echo '__pskb_copy_fclone'
          echo '__regmap_init'
          echo 'bit_wait_timeout'
          echo 'bt_err'
          echo 'bt_info'
          echo 'bt_to_errno'
          echo 'bt_warn'
          echo 'btbcm_set_bdaddr'
          echo 'btbcm_setup_apple'
          echo 'btbcm_setup_patchram'
          echo 'dev_coredumpv'
          echo 'dev_set_threaded'
          echo 'device_release_driver'
          echo 'flush_signals'
          echo 'gpiod_get_optional'
          echo 'gpiod_put'
          echo 'hci_alloc_dev_priv'
          echo 'hci_cmd_sync'
          echo 'hci_cmd_sync_cancel'
          echo 'hci_free_dev'
          echo 'hci_recv_diag'
          echo 'hci_recv_frame'
          echo 'hci_register_dev'
          echo 'hci_unregister_dev'
          echo 'iwe_stream_add_event'
          echo 'iwe_stream_add_point'
          echo 'kern_path'
          echo 'kernel_sigaction'
          echo 'kill_pid'
          echo 'led_trigger_blink'
          echo 'led_trigger_blink_oneshot'
          echo 'of_get_mac_address'
          echo 'out_of_line_wait_on_bit_timeout'
          echo 'pci_disable_link_state'
          echo 'pcie_capability_clear_and_set_word'
          echo 'proc_get_parent_data'
          echo 'radix_tree_tagged'
          echo 'rfkill_pause_polling'
          echo 'rhashtable_init'
          echo 'sched_set_fifo_low'
          echo 'skb_pull_data'
          echo 'skb_to_sgvec'
          echo 'skb_unlink'
          echo 'stpcpy'
          echo 'usb_alloc_coherent'
          echo 'usb_alloc_urb'
          echo 'usb_anchor_urb'
          echo 'usb_autopm_get_interface'
          echo 'usb_autopm_put_interface'
          echo 'usb_bulk_msg'
          echo 'usb_control_msg'
          echo 'usb_deregister'
          echo 'usb_driver_claim_interface'
          echo 'usb_driver_release_interface'
          echo 'usb_find_common_endpoints'
          echo 'usb_free_coherent'
          echo 'usb_free_urb'
          echo 'usb_get_dev'
          echo 'usb_get_from_anchor'
          echo 'usb_get_urb'
          echo 'usb_ifnum_to_if'
          echo 'usb_init_urb'
          echo 'usb_interrupt_msg'
          echo 'usb_kill_anchored_urbs'
          echo 'usb_kill_urb'
          echo 'usb_match_id'
          echo 'usb_poison_urb'
          echo 'usb_put_dev'
          echo 'usb_queue_reset_device'
          echo 'usb_register_driver'
          echo 'usb_reset_device'
          echo 'usb_scuttle_anchored_urbs'
          echo 'usb_set_interface'
          echo 'usb_submit_urb'
          echo 'usb_unanchor_urb'
          echo 'usb_unpoison_urb'
          echo 'wake_up_bit'
          echo 'yield'
        } > missing_symbols.txt
        
        for list_file in aosp/android/abi_gki_aarch64 aosp/android/abi_gki_aarch64_pixel aosp/android/abi_gki_aarch64_core aosp/android/abi_gki_aarch64_virtual_device; do
            if [ -f "$list_file" ]; then
                chmod u+w "$list_file" || true
                echo "" >> "$list_file"
                cat missing_symbols.txt >> "$list_file"
                echo "Patched KMI Symbol List: $list_file"
            fi
        done

    - name: Track Loadable Modules in Bazel (shusky:kernel only)
      run: |
        cd workspace/aosp
        
        # Track modules strictly in //private/devices/google/shusky:kernel via buildozer
        wget -qO buildozer https://github.com/bazelbuild/buildtools/releases/latest/download/buildozer-linux-amd64
        chmod +x buildozer
        ./buildozer 'add module_outs drivers/net/wireless/realtek/rtl8812au/8812au.ko drivers/bluetooth/btrtl.ko drivers/bluetooth/btusb.ko drivers/bluetooth/btintel.ko drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2-common.ko drivers/net/wireless/mediatek/mt76/mt76.ko drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko drivers/net/wireless/mediatek/mt76/mt76-usb.ko drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko' //private/devices/google/shusky:kernel
          
    - name: Compile Pixel 8 Pro Kernel via Bazel      
      run: |        
        cd workspace
        ./build_shusky.sh \
          --kernel_package=@//aosp \
          --//build/kernel/kleaf:use_prebuilt_gki=false \
          --no//private/devices/google/common:download_prebuilt_gki_fips140 \
          --notrim \
          --nokmi_symbol_list_strict_mode

    - name: Package Kernel, Firmware, Drivers, and Partitions into Flat Bundle
      run: |
        cd workspace
        mkdir -p bundle
        
        git clone https://github.com/stoag/AnyKernel3-Pixel8Pro.git AnyKernel3
        
        wget -qO AnyKernel3/tools/busybox https://raw.githubusercontent.com/xerta555/Busybox-Binaries/master/busybox-arm64
        chmod +x AnyKernel3/tools/busybox
        wget -qO magisk.zip https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
        unzip -j magisk.zip lib/arm64-v8a/libmagiskboot.so
        mv libmagiskboot.so AnyKernel3/tools/magiskboot
        chmod +x AnyKernel3/tools/magiskboot
        rm magisk.zip
        
        cp -L out/shusky/dist/Image.lz4 AnyKernel3/
        
        # Fetch ALL Official Linux Firmware variants for MT7612U (Both 'u' and 'non-u' binaries)
        mkdir -p AnyKernel3/twk_firmware/mediatek
        curl -L "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662.bin" -o AnyKernel3/twk_firmware/mediatek/mt7662.bin
        curl -L "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662_rom_patch.bin" -o AnyKernel3/twk_firmware/mediatek/mt7662_rom_patch.bin
        curl -L "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662u.bin" -o AnyKernel3/twk_firmware/mediatek/mt7662u.bin
        curl -L "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662u_rom_patch.bin" -o AnyKernel3/twk_firmware/mediatek/mt7662u_rom_patch.bin
        
        # Copy the Realtek driver AND the MediaTek modular stack (using -L to dereference Bazel symlinks)
        mkdir -p AnyKernel3/twk_drivers
        find -L out/shusky/dist -name "8812au.ko" -exec cp -L {} AnyKernel3/twk_drivers/ \;
        find -L out/shusky/dist -name "mt76*.ko" -exec cp -L {} AnyKernel3/twk_drivers/ \;
        
        echo "VERIFYING COPIED DRIVERS:"
        ls -lh AnyKernel3/twk_drivers/
        
        sed -i "s/kernel.string=.*/kernel.string=Tweaker Kernel (twk.v${{ env.CUSTOM_KERNEL_VERSION }})/g" AnyKernel3/anykernel.sh
        
        {
          echo '# --- TWEAKER KERNEL HYBRID INJECTION ---'
          echo 'ui_print " ";'
          echo 'ui_print "- Injecting Mediatek Firmware & Adapter Drivers...";'
          echo 'mount /data;'
          echo 'MOD_DIR="/data/adb/modules/twk_nethunter_adapters"'
          echo 'rm -rf $MOD_DIR'
          
          echo 'mkdir -p $MOD_DIR/system/vendor/firmware/mediatek'
          echo 'cp -rf $home/twk_firmware/mediatek/* $MOD_DIR/system/vendor/firmware/mediatek/'
          
          echo 'mkdir -p $MOD_DIR/system/vendor/lib/modules'
          echo 'cp -f $home/twk_drivers/*.ko $MOD_DIR/system/vendor/lib/modules/'
          
          echo 'echo "id=twk_nethunter_adapters" > $MOD_DIR/module.prop'
          echo 'echo "name=Tweaker Kernel Hybrid Adapters" >> $MOD_DIR/module.prop'
          echo 'echo "version=twk.v${{ env.CUSTOM_KERNEL_VERSION }}" >> $MOD_DIR/module.prop'
          echo 'echo "versionCode=109" >> $MOD_DIR/module.prop'
          echo 'echo "author=Tweaker" >> $MOD_DIR/module.prop'
          echo 'echo "description=RAM-disk firmware bypass and modular drivers for Realtek/MTK." >> $MOD_DIR/module.prop'
          
          echo 'cat << '"'"'EOF_SERVICE'"'"' > $MOD_DIR/service.sh'
          echo '#!/system/bin/sh'
          echo 'MOD_BASE="/data/adb/modules/twk_nethunter_adapters/system/vendor"'
          echo ''
          echo '# 1. Create temporary RAM disks'
          echo 'mkdir -p /dev/twk_modules'
          echo 'mkdir -p /dev/twk_firmware'
          echo ''
          echo '# 2. Stage kernel modules'
          echo 'cp $MOD_BASE/lib/modules/*.ko /dev/twk_modules/'
          echo 'chmod 644 /dev/twk_modules/*.ko'
          echo 'chcon -R u:object_r:vendor_file:s0 /dev/twk_modules'
          echo ''
          echo '# 3. Stage and flatten firmware (Bypasses subfolder traps)'
          echo 'cp $MOD_BASE/firmware/mediatek/*.bin /dev/twk_firmware/ 2>/dev/null || true'
          echo 'cp $MOD_BASE/firmware/*.bin /dev/twk_firmware/ 2>/dev/null || true'
          echo 'chmod 644 /dev/twk_firmware/*.bin'
          echo ''
          echo '# 4. Authorize the kernel to read the firmware via SELinux'
          echo 'chcon -R u:object_r:vendor_file:s0 /dev/twk_firmware'
          echo ''
          echo '# 5. Point the kernel to our new RAM disk'
          echo 'echo "/dev/twk_firmware" > /sys/module/firmware_class/parameters/path'
          echo ''
          echo '# 6. Load the drivers safely'
          echo 'insmod /dev/twk_modules/mt76.ko'
          echo 'insmod /dev/twk_modules/mt76-usb.ko'
          echo 'insmod /dev/twk_modules/mt76x02-lib.ko'
          echo 'insmod /dev/twk_modules/mt76x02-usb.ko'
          echo 'insmod /dev/twk_modules/mt76x2-common.ko'
          echo 'insmod /dev/twk_modules/mt76x2u.ko'
          echo 'insmod /dev/twk_modules/8812au.ko rtw_drv_log_level=6 rtw_power_mgnt=0 rtw_switch_usb_mode=0'
          echo 'EOF_SERVICE'
          
          echo 'chmod +x $MOD_DIR/service.sh'
          
          echo 'ui_print "- Dual Adapter support integrated successfully!";'
          echo '# ---------------------------------------------------'
        } >> AnyKernel3/anykernel.sh
        
        cd AnyKernel3
        zip -r9 ../bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-anykernel3.zip * -x README.md
        cd ..

        find out/ -type f -name "init_boot.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-init_boot.img \;
        find out/ -type f -name "vendor_dlkm.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-vendor_dlkm.img \;
        find out/ -type f -name "vendor_kernel_boot.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-vendor_kernel_boot.img \;
        find out/ -type f -name "system_dlkm.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-system_dlkm.img \;
        
        echo "VERIFYING BUNDLE CONTENTS:"
        ls -lh bundle/

    - name: Upload Flat Bundle Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twk-v${{ env.CUSTOM_KERNEL_VERSION }}-release-package
        path: workspace/bundle/*
        if-no-files-found: error

    - name: Ping Phone - Success
      if: success()
      run: curl -d "✅ Pixel 8 Pro Kernel twk.v${{ env.CUSTOM_KERNEL_VERSION }} Build COMPLETE! Grab the clean package files!" https://ntfy.sh/twk_pixel8_build_alerts

    - name: Ping Phone - Failure
      if: failure()
      run: curl -d "❌ Pixel 8 Pro Kernel Build FAILED! Check the logs." https://ntfy.sh/twk_pixel8_build_alerts
