name: Build Pixel 8 Pro (shusky) - NetHunter + KernelSU-Next (v1.33)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      CUSTOM_KERNEL_VERSION: "1.33"

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential curl flex bison
          sudo apt-get install -y libssl-dev libelf-dev python3 repo
          sudo apt-get install -y git zip libncurses5-dev wget

      - name: Configure Git Credentials
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@localhost"

      - name: Cache Bazel & Kleaf Build Output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            workspace/out/bazel
          key: ${{ runner.os }}-bazel-shusky-v133
          restore-keys: |
            ${{ runner.os }}-bazel-shusky-

      - name: Initialize & Sync Google Kernel Source
        run: |
          mkdir -p workspace
          cd workspace
          MANIFEST="https://android.googlesource.com/kernel/manifest"
          BRANCH="android-gs-shusky-6.1-android16"
          repo init -u "$MANIFEST" -b "$BRANCH" --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Inspect Kleaf Build Configuration
        run: |
          cd workspace

          echo "===== COMMON KERNELS CONFIGURATION ====="
          nl -ba build/kernel/kleaf/common_kernels.bzl | sed -n '540,650p'

          echo "===== AOSP BUILD CONFIGURATION ====="
          nl -ba aosp/BUILD.bazel | sed -n '130,165p'

      - name: Inspect AOSP Bazel Kernel Definition
        run: |
          cd workspace
          echo "===== AOSP BUILD.bazel ====="
          sed -n '1,240p' aosp/BUILD.bazel
          echo "===== SHUSKY BUILD.bazel ====="
          grep -n -A35 -B10 "module_outs" \
            private/devices/google/shusky/BUILD.bazel
          echo "===== SHUSKY BUILD FILE: TOP ====="
          sed -n '1,100p' private/devices/google/shusky/BUILD.bazel

          echo "===== ZUMA MODULE OUTPUT DEFINITION ====="
          grep -R -n -A100 -B10 "ZUMA_MODULE_OUTS" private/devices/google/zuma private/devices/google/shusky
        
      - name: Dump Build.bazel Files for Review
        uses: actions/upload-artifact@v4
        with:
          name: bazel-build-scripts
          path: |
            workspace/aosp/BUILD.bazel
            workspace/private/devices/google/shusky/BUILD.bazel
            
      - name: Apply Kali NetHunter Subsystem Overrides
        run: |
          cd workspace/aosp
          find drivers/net/wireless -name "Kconfig" \
            -exec sed -i '/select MAC80211_LEDS/d' {} +
          sed -i 's/config MAC80211_LEDS/config MAC80211_LEDS\n\tdepends on BROKEN/g' \
            net/mac80211/Kconfig

      - name: Inject Morrownr Linux 6.1-Ready Driver (8812AU)
        run: |
          cd workspace/aosp
          RTL_DIR="drivers/net/wireless/realtek"
          chmod u+w "$RTL_DIR/Makefile"
          rm -rf "$RTL_DIR/rtw88" "$RTL_DIR/rtl8812au"
          mkdir -p "$RTL_DIR/rtw88"
          touch "$RTL_DIR/rtw88/Kconfig"
          REPO="https://github.com/stoag/8812au-20210820.git"
          git clone "$REPO" "$RTL_DIR/rtl8812au"
          rm -rf "$RTL_DIR/rtl8812au/.git"
          MK="$RTL_DIR/rtl8812au/Makefile"
          sed -i 's/CONFIG_RTW_NAPI = y/CONFIG_RTW_NAPI = n/g' "$MK"
          sed -i 's/CONFIG_RTW_GRO = y/CONFIG_RTW_GRO = n/g' "$MK"
          sed -i 's/CONFIG_RTW_NETIF_SG = y/CONFIG_RTW_NETIF_SG = n/g' "$MK"
          sed -i 's/CONFIG_LOAD_PHY_PARA_FROM_FILE = y/CONFIG_LOAD_PHY_PARA_FROM_FILE = n/g' "$MK"
          sed -i 's/ccflags-y += -DCONFIG_CONCURRENT_MODE/#ccflags-y += -DCONFIG_CONCURRENT_MODE/g' "$MK"
          echo 'ccflags-y += -DCONFIG_USE_USB_BUFFER_ALLOC_TX' >> "$MK"
          echo 'ccflags-y += -DCONFIG_USE_USB_BUFFER_ALLOC_RX' >> "$MK"
          echo 'obj-y += rtl8812au/' >> "$RTL_DIR/Makefile"
          echo 'obj-m := $(MODULE_NAME).o' >> "$MK"

      - name: Apply KernelSU-Next & NetHunter Configs
        run: |
          cd workspace/aosp
          KSU_URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          curl -LSs "$KSU_URL" | bash -
          KSU_GIT_VER=$(git -C KernelSU-Next rev-list --count HEAD)
          KSU_TAG=$(git -C KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo "v3.4.2")
          KB="KernelSU-Next/kernel/Kbuild"
          sed -i "s/KSU_GIT_VERSION := .*/KSU_GIT_VERSION := ${KSU_GIT_VER}/g" "$KB"
          sed -i "s/KSU_VERSION_TAG := .*/KSU_VERSION_TAG := ${KSU_TAG}/g" "$KB"
          sed -i "1i KSU_GIT_VERSION := ${KSU_GIT_VER}" "$KB"
          sed -i "1i KSU_GIT_VERSION_VALID := 1" "$KB"
          sed -i "1i KSU_GIT_TAG := ${KSU_TAG}" "$KB"
          sed -i "1i KSU_VERSION_TAG := ${KSU_TAG}" "$KB"
          chmod u+w build.config.gki
          echo "DEFCONFIG=gki_defconfig" > build.config.gki
          DEF="arch/arm64/configs/gki_defconfig"
          chmod u+w "$DEF"
          {
            echo 'CONFIG_LOCALVERSION="-twk.v${{ env.CUSTOM_KERNEL_VERSION }}"'
            echo 'CONFIG_KSU=y'
            echo 'CONFIG_TRIM_NONLISTED_KMI=n'
            echo 'CONFIG_TASKSTATS=y'
            echo 'CONFIG_TASK_DELAY_ACCT=y'
            echo 'CONFIG_TASK_XACCT=y'
            echo 'CONFIG_TASK_IO_ACCOUNTING=y'
            echo 'CONFIG_VM_EVENT_COUNTERS=y'
            echo 'CONFIG_CONFIGFS_FS=y'
            echo 'CONFIG_USB_CONFIGFS=y'
            echo 'CONFIG_USB_GADGETFS=y'
            echo 'CONFIG_USB_CONFIGFS_F_HID=y'
            echo 'CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y'
            echo 'CONFIG_USB_CONFIGFS_F_ECM=y'
            echo 'CONFIG_USB_CONFIGFS_F_ACM=y'
            echo 'CONFIG_USB_CONFIGFS_RNDIS=y'
            echo 'CONFIG_USB_CONFIGFS_NCM=y'
            echo 'CONFIG_NETFILTER_NETLINK_LOG=y'
            echo 'CONFIG_NETFILTER_NETLINK_QUEUE=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_LOG=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_NFLOG=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_OWNER=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_STATE=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_MARK=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_MARK=y'
            echo 'CONFIG_IP_NF_NAT=y'
            echo 'CONFIG_IP6_NF_NAT=y'
            echo 'CONFIG_IP_NF_MANGLE=y'
            echo 'CONFIG_IP6_NF_MANGLE=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_HL=y'
            echo 'CONFIG_IP_NF_TARGET_TTL=y'
            echo 'CONFIG_IP6_NF_TARGET_HL=y'
            echo 'CONFIG_WIREGUARD=y'
            echo 'CONFIG_TCP_CONG_BBR=y'
            echo 'CONFIG_NTFS3_FS=y'
            echo 'CONFIG_ISO9660_FS=y'
            echo 'CONFIG_UDF_FS=y'
            echo 'CONFIG_SQUASHFS=y'
            echo 'CONFIG_SQUASHFS_XZ=y'
            echo 'CONFIG_SQUASHFS_ZSTD=y'
            echo 'CONFIG_UTS_NS=y'
            echo 'CONFIG_IPC_NS=y'
            echo 'CONFIG_PID_NS=y'
            echo 'CONFIG_USER_NS=y'
            echo 'CONFIG_MACVLAN=y'
            echo 'CONFIG_CPU_FREQ_GOV_ONDEMAND=y'
            echo 'CONFIG_POWER_SUPPLY_DEBUG=y'
            echo 'CONFIG_THERMAL_GOV_USER_SPACE=y'
            echo 'CONFIG_CFG80211=m'
            echo 'CONFIG_MAC80211=m'
            echo 'CONFIG_CFG80211_CERTIFICATION_ONUS=y'
            echo 'CONFIG_WIRELESS=y'
            echo 'CONFIG_WLAN_VENDOR_REALTEK=y'
            echo 'CONFIG_WLAN_VENDOR_MEDIATEK=y'
            echo 'CONFIG_MT76_CORE=m'
            echo 'CONFIG_MT76_USB=m'
            echo 'CONFIG_MT76x02_LIB=m'
            echo 'CONFIG_MT76x02_USB=m'
            echo 'CONFIG_MT76x2_COMMON=m'
            echo 'CONFIG_MT76x2U=m'
            echo 'CONFIG_BT_HCIBTUSB=m'
            echo 'CONFIG_USB_ACM=m'
            echo 'CONFIG_USB_SERIAL=m'
            echo 'CONFIG_USB_SERIAL_CH341=m'
            echo 'CONFIG_USB_SERIAL_CP210X=m'
            echo 'CONFIG_USB_NET_AX88179_178A=m'
            echo 'CONFIG_CAN=m'
            echo 'CONFIG_CAN_RAW=m'
            echo 'CONFIG_CAN_SLCAN=m'
            echo 'CONFIG_CAN_GS_USB=m'
          } >> "$DEF"

      - name: Authorize NetHunter Symbols in GKI
        run: |
          cd workspace
          {
            echo '_bcd2bin'
            echo '__dev_kfree_skb_irq'
            echo '__hci_cmd_sync'
            echo '__hci_cmd_sync_ev'
            echo '__ioread32_copy'
            echo '__iowrite32_copy'
            echo '__printk_ratelimit'
            echo '__pskb_copy_fclone'
            echo '__regmap_init'
            echo 'bit_wait_timeout'
            echo 'bt_err'
            echo 'bt_info'
            echo 'bt_to_errno'
            echo 'bt_warn'
            echo 'btbcm_set_bdaddr'
            echo 'btbcm_setup_apple'
            echo 'btbcm_setup_patchram'
            echo 'dev_coredumpv'
            echo 'dev_set_threaded'
            echo 'device_release_driver'
            echo 'firmware_request_cache'
            echo 'flush_signals'
            echo 'gpiod_get_optional'
            echo 'gpiod_put'
            echo 'hci_alloc_dev_priv'
            echo 'hci_cmd_sync'
            echo 'hci_cmd_sync_cancel'
            echo 'hci_free_dev'
            echo 'hci_recv_diag'
            echo 'hci_recv_frame'
            echo 'hci_register_dev'
            echo 'hci_unregister_dev'
            echo 'iwe_stream_add_event'
            echo 'iwe_stream_add_point'
            echo 'kern_path'
            echo 'kernel_sigaction'
            echo 'kill_pid'
            echo 'led_trigger_blink'
            echo 'led_trigger_blink_oneshot'
            echo 'of_get_mac_address'
            echo 'out_of_line_wait_on_bit_timeout'
            echo 'pci_disable_link_state'
            echo 'pcie_capability_clear_and_set_word'
            echo 'proc_get_parent_data'
            echo 'radix_tree_tagged'
            echo 'rfkill_pause_polling'
            echo 'rhashtable_init'
            echo 'sched_set_fifo_low'
            echo 'skb_pull_data'
            echo 'skb_to_sgvec'
            echo 'skb_unlink'
            echo 'stpcpy'
            echo 'usb_alloc_coherent'
            echo 'usb_alloc_urb'
            echo 'usb_anchor_urb'
            echo 'usb_autopm_get_interface'
            echo 'usb_autopm_put_interface'
            echo 'usb_bulk_msg'
            echo 'usb_control_msg'
            echo 'usb_deregister'
            echo 'usb_driver_claim_interface'
            echo 'usb_driver_release_interface'
            echo 'usb_find_common_endpoints'
            echo 'usb_free_coherent'
            echo 'usb_free_urb'
            echo 'usb_get_dev'
            echo 'usb_get_from_anchor'
            echo 'usb_get_urb'
            echo 'usb_ifnum_to_if'
            echo 'usb_init_urb'
            echo 'usb_interrupt_msg'
            echo 'usb_kill_anchored_urbs'
            echo 'usb_kill_urb'
            echo 'usb_match_id'
            echo 'usb_poison_urb'
            echo 'usb_put_dev'
            echo 'usb_queue_reset_device'
            echo 'usb_register_driver'
            echo 'usb_reset_device'
            echo 'usb_scuttle_anchored_urbs'
            echo 'usb_set_interface'
            echo 'usb_submit_urb'
            echo 'usb_unanchor_urb'
            echo 'usb_unpoison_urb'
            echo 'wake_up_bit'
            echo 'yield'
          } > missing_symbols.txt
          for f in aosp/android/abi_gki_aarch64*; do
            if [ -f "$f" ]; then
              chmod u+w "$f" || true
              echo "" >> "$f"
              cat missing_symbols.txt >> "$f"
            fi
          done

      - name: Register Additional Modules in Zuma Kleaf Constants
        run: |
          cd workspace

          python3 - <<'PY'
          from pathlib import Path
          import re

          build_file = Path(
              "private/devices/google/zuma/constants.bzl"
          )

          if not build_file.is_file():
              raise SystemExit(
                  f"Missing expected file: {build_file}"
              )

          build_file.chmod(
              build_file.stat().st_mode | 0o200
          )

          source = build_file.read_text()

          # Locate the shared ZUMA_MODULE_OUTS list.
          pattern = re.compile(
              r"(?ms)^(ZUMA_MODULE_OUTS\s*=\s*\[)(.*?)(^\])"
          )

          match = pattern.search(source)

          if not match:
              raise SystemExit(
                  "Could not locate ZUMA_MODULE_OUTS list. "
                  "No changes made."
              )

          header, body, closing = match.groups()

          # These are the additional modules identified
          # in the previous Bazel build output.
          additions = {
              "drivers/bluetooth/btintel.ko",
              "drivers/net/wireless/mediatek/mt76/mt76-usb.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko",
              "drivers/net/wireless/realtek/rtl8812au/8812au.ko",
          }

          existing = set(
              re.findall(
                  r'"([^"]+\.ko)"',
                  body
              )
          )

          combined = sorted(existing | additions)

          # Preserve existing comments in the list.
          comments = [
              line for line in body.splitlines()
              if line.strip().startswith("#")
          ]

          new_body = "\n"

          for comment in comments:
              new_body += comment + "\n"

          for module in combined:
              new_body += f'    "{module}",\n'

          replacement = header + new_body + closing

          updated = (
              source[:match.start()]
              + replacement
              + source[match.end():]
          )

          build_file.write_text(updated)

          print("Updated:", build_file)
          print("Existing module entries:", len(existing))
          print("Additional entries:", len(additions - existing))
          print("\nFinal ZUMA_MODULE_OUTS:")

          for module in combined:
              print("  " + module)
          PY

          echo "===== UPDATED ZUMA MODULE OUTPUTS ====="
          grep -n -A45 "ZUMA_MODULE_OUTS" \
            private/devices/google/zuma/constants.bzl

      - name: Register NetHunter Modules in AOSP GKI Target
        run: |
          cd workspace

          python3 - <<'PY'
          from pathlib import Path
          import re

          build_file = Path("aosp/BUILD.bazel")

          if not build_file.is_file():
              raise SystemExit(f"Missing {build_file}")

          build_file.chmod(
              build_file.stat().st_mode | 0o200
          )

          source = build_file.read_text()

          modules = [
              "drivers/net/wireless/mediatek/mt76/mt76-usb.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko",
              "drivers/net/wireless/realtek/rtl8812au/8812au.ko",
              "drivers/bluetooth/btintel.ko",
              "drivers/usb/serial/cp210x.ko",
              "drivers/bluetooth/btrtl.ko",
              "drivers/usb/serial/ch341.ko",
              "net/wireless/cfg80211.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko",
              "drivers/net/wireless/mediatek/mt76/mt76.ko",
              "drivers/bluetooth/btusb.ko",
              "net/mac80211/mac80211.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2-common.ko",
              "drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko",
              "drivers/net/can/usb/gs_usb.ko",
          ]

          # Find the exact kernel_aarch64 configuration.
          pattern = re.compile(
              r'("kernel_aarch64"\s*:\s*\{.*?)'
              r'(\n[ \t]*)"module_implicit_outs"\s*:\s*'
              r'get_gki_modules_list\("arm64"\)\s*,',
              re.S
          )

          matches = list(pattern.finditer(source))

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one kernel_aarch64 "
                  f"configuration match; found {len(matches)}. "
                  "No changes made."
              )

          match = matches[0]
          prefix, implicit_line = match.groups()

          # Do not add duplicate declarations.
          config_start = match.start()
          config_end = source.find(
              "\n    },",
              match.end()
          )

          if config_end == -1:
              raise SystemExit(
                  "Could not locate end of kernel_aarch64 "
                  "configuration. No changes made."
              )

          config = source[config_start:config_end]

          if '"module_outs"' in config:
              raise SystemExit(
                  "kernel_aarch64 already has module_outs. "
                  "Inspect the existing list before changing it."
              )

          indent = implicit_line.split("\n")[-1]
          module_indent = indent + "    "

          declaration = (
              implicit_line
              + "\n"
              + indent
              + '"module_outs": [\n'
          )

          for module in modules:
              declaration += (
                  module_indent + f'"{module}",\n'
              )

          declaration += indent + "],"

          updated = (
              source[:match.start()]
              + prefix
              + declaration
              + source[match.end():]
          )

          build_file.write_text(updated)

          print("Successfully updated:", build_file)
          print("Registered modules:", len(modules))
          print("\nDeclared module outputs:")

          for module in modules:
              print("  " + module)
          PY

          echo "===== UPDATED AOSP KERNEL CONFIGURATION ====="
          sed -n '1,100p' aosp/BUILD.bazel


      - name: Compile Pixel 8 Pro Kernel via Bazel
        run: |
          cd workspace
          ./build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --notrim \
            --nokmi_symbol_list_strict_mode

      - name: Package Flat Release Bundle
        run: |
          cd workspace
          rm -rf bundle AnyKernel3
          git clone https://github.com/stoag/AnyKernel3-Pixel8Pro.git AnyKernel3
          mkdir -p bundle AnyKernel3/twk_drivers AnyKernel3/twk_firmware
          BB_URL="https://raw.githubusercontent.com/xerta555/Busybox-Binaries/master/busybox-arm64"
          wget -qO AnyKernel3/tools/busybox "$BB_URL"
          chmod +x AnyKernel3/tools/busybox
          MG_URL="https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk"
          wget -qO magisk.zip "$MG_URL"
          unzip -j magisk.zip lib/arm64-v8a/libmagiskboot.so
          mv libmagiskboot.so AnyKernel3/tools/magiskboot
          chmod +x AnyKernel3/tools/magiskboot
          rm -f magisk.zip
          cp -L out/shusky/dist/Image.lz4 AnyKernel3/
          FW_URL="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain"
          for fw in mt7662.bin mt7662_rom_patch.bin mt7662u.bin mt7662u_rom_patch.bin; do
            curl -fLSs "$FW_URL/mediatek/$fw" -o "AnyKernel3/twk_firmware/$fw" \
              || curl -fLSs "$FW_URL/$fw" -o "AnyKernel3/twk_firmware/$fw" || true
          done
          curl -fLSs "$FW_URL/rt2870.bin" -o AnyKernel3/twk_firmware/rt2870.bin || true
          for ko in \
            8812au.ko mt76.ko mt76-usb.ko mt76x02-lib.ko mt76x02-usb.ko \
            mt76x2-common.ko mt76x2u.ko btintel.ko btrtl.ko btusb.ko \
            cdc-acm.ko usbserial.ko ch341.ko cp210x.ko ftdi_sio.ko \
            ax88179_178a.ko r8152.ko can.ko can-raw.ko can-dev.ko slcan.ko gs_usb.ko
          do
            if [ -f "out/shusky/dist/$ko" ]; then
              cp -L "out/shusky/dist/$ko" AnyKernel3/twk_drivers/
            else
              find out/ -path "*/dist/$ko" \
                -exec cp -L {} AnyKernel3/twk_drivers/ \; -quit 2>/dev/null || true
            fi
          done
          ls -lh AnyKernel3/twk_drivers/
          ls -lh AnyKernel3/twk_firmware/
          VER="${{ env.CUSTOM_KERNEL_VERSION }}"
          sed -i "s/kernel.string=.*/kernel.string=Tweaker Kernel (v${VER})/g" AnyKernel3/anykernel.sh
          {
            echo '# --- TWEAKER KERNEL NON-SHADOWING ADAPTER INJECTION ---'
            echo 'ui_print " ";'
            echo 'ui_print "- Staging Non-Shadowing NetHunter Drivers & Firmware...";'
            echo 'mount /data;'
            echo 'MOD_DIR="/data/adb/modules/twk_nethunter_adapters"'
            echo 'rm -rf "$MOD_DIR"'
            echo 'mkdir -p "$MOD_DIR/twk_firmware" "$MOD_DIR/twk_modules"'
            echo 'cp -f "$home"/twk_firmware/*.bin "$MOD_DIR/twk_firmware/"'
            echo 'cp -f "$home"/twk_drivers/*.ko "$MOD_DIR/twk_modules/"'
            echo 'echo "id=twk_nethunter_adapters" > "$MOD_DIR/module.prop"'
            echo 'echo "name=Tweaker Kernel Adapters" >> "$MOD_DIR/module.prop"'
            echo 'echo "version=v1.33" >> "$MOD_DIR/module.prop"'
            echo 'echo "versionCode=133" >> "$MOD_DIR/module.prop"'
            echo 'echo "author=Tweaker" >> "$MOD_DIR/module.prop"'
            echo 'echo "description=Non-shadowing RAM-disk drivers." >> "$MOD_DIR/module.prop"'
            echo 'SV="$MOD_DIR/service.sh"'
            echo 'echo "#!/system/bin/sh" > "$SV"'
            echo 'echo "MOD_DIR=/data/adb/modules/twk_nethunter_adapters" >> "$SV"'
            echo 'echo "while [ \"\$(getprop sys.boot_completed)\" != \"1\" ]; do sleep 2; done" >> "$SV"'
            echo 'echo "mkdir -p /dev/twk_modules /dev/twk_firmware" >> "$SV"'
            echo 'echo "LOG=/dev/twk_modules/load.log" >> "$SV"'
            echo 'echo "ln -sf /vendor/firmware/* /dev/twk_firmware/ 2>/dev/null || true" >> "$SV"'
            echo 'echo "ln -sf /vendor/firmware/mediatek/* /dev/twk_firmware/ 2>/dev/null || true" >> "$SV"'
            echo 'echo "cp -f \$MOD_DIR/twk_firmware/*.bin /dev/twk_firmware/ 2>/dev/null || true" >> "$SV"'
            echo 'echo "cp -f \$MOD_DIR/twk_modules/*.ko /dev/twk_modules/ 2>/dev/null || true" >> "$SV"'
            echo 'echo "echo -n /dev/twk_firmware > /sys/module/firmware_class/parameters/path" >> "$SV"'
            echo 'for m in btintel.ko btrtl.ko btusb.ko mt76.ko mt76-usb.ko mt76x02-lib.ko mt76x02-usb.ko mt76x2-common.ko mt76x2u.ko cdc-acm.ko usbserial.ko ch341.ko cp210x.ko ftdi_sio.ko ax88179_178a.ko r8152.ko can.ko can-raw.ko can-dev.ko slcan.ko gs_usb.ko; do'
            echo '  echo "[ -f /dev/twk_modules/$m ] && insmod /dev/twk_modules/$m >> \$LOG 2>&1 || true" >> "$SV"'
            echo 'done'
            echo 'echo "[ -f /dev/twk_modules/8812au.ko ] && insmod /dev/twk_modules/8812au.ko rtw_drv_log_level=6 rtw_power_mgnt=0 rtw_switch_usb_mode=0 >> \$LOG 2>&1 || true" >> "$SV"'
            echo 'chmod +x "$SV"'
            echo 'ui_print "- Non-shadowing drivers & firmware staged successfully!";'
          } >> AnyKernel3/anykernel.sh
          (cd AnyKernel3 && zip -r9 "../bundle/twk-v${VER}-anykernel3.zip" * -x .git README.md)
          for img in vendor_kernel_boot.img vendor_dlkm.img system_dlkm.img; do
            if [ -f "out/shusky/dist/$img" ]; then
              cp -L "out/shusky/dist/$img" "bundle/twk-v${VER}-$img"
            else
              find out/ -type f -name "$img" \
                -exec cp -L {} "bundle/twk-v${VER}-$img" \; -quit
            fi
          done
          ls -lh bundle/

      - name: Upload Flat Release Bundle (Single Zip)
        uses: actions/upload-artifact@v4
        with:
          name: twk-v${{ env.CUSTOM_KERNEL_VERSION }}-release-package
          path: workspace/bundle/*
          if-no-files-found: error

      - name: Ping Phone - Success
        if: success()
        run: |
          MSG="✅ Pixel 8 Pro Kernel Build (v${{ env.CUSTOM_KERNEL_VERSION }}) COMPLETE!"
          curl -d "$MSG" https://ntfy.sh/twk_pixel8_build_alerts

      - name: Ping Phone - Failure
        if: failure()
        run: |
          MSG="❌ Pixel 8 Pro Kernel Build (v${{ env.CUSTOM_KERNEL_VERSION }}) FAILED!"
          curl -d "$MSG" https://ntfy.sh/twk_pixel8_build_alerts
# END OF WORKFLOW
