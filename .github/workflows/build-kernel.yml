name: Build Pixel 8 Pro Tweakers Paradise - NetHunter + KernelSU Next + ConfigFS

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free Runner Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential curl flex bison libssl-dev \
          libelf-dev python3 repo git zip libncurses5-dev

    - name: Configure Git Credentials
      run: |
        git config --global user.name "Builder"
        git config --global user.email "builder@localhost"

    - name: Initialize & Sync Google Kernel Source
      run: |
        mkdir workspace && cd workspace
        # Target the official Android 16 / Tensor G3 (shusky) branch
        repo init -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 --depth=1
        
        # Sync only what is necessary to conserve storage and bandwidth
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    - name: Apply Kali NetHunter Drivers & Patches
      run: |
        cd workspace/aosp # Main GKI Linux kernel tree
        
        # 1. Download and apply Kali mac80211 Wi-Fi injection patch
        curl -s https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project/-/raw/master/patches/6.1/0001-mac80211-injection.patch > injection.patch
        patch -p1 < injection.patch || true
        rm injection.patch

        # 2. Mark MAC80211_LEDS as broken in Kconfig to avoid missing LED symbols
        find drivers/net/wireless -name "Kconfig" -exec sed -i '/select MAC80211_LEDS/d' {} +
        sed -i 's/config MAC80211_LEDS/config MAC80211_LEDS\n\tdepends on BROKEN/g' net/mac80211/Kconfig

        # 3. Download and apply HID gadget patch
        curl -s https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project/-/raw/master/patches/6.1/0002-hid-gadget.patch > hid.patch
        patch -p1 < hid.patch || true
        rm hid.patch

    - name: Apply KernelSU Next Patches
      run: |
        cd workspace/aosp
        
        # 1. Install KernelSU Next (Default Next Branch)
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        
        # 2. Enable KSU, ConfigFS, Disable KMI Trimming, and Modular Wi-Fi Drivers
        cat << 'EOF' >> arch/arm64/configs/gki_defconfig
        # KSU
        CONFIG_KSU=y

        # Disable Google GKI Symbol Trimming
        CONFIG_TRIM_NONLISTED_KMI=n

        # USB Arsenal & HID
        CONFIG_CONFIGFS_FS=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_GADGETFS=y
        CONFIG_USB_CONFIGFS_F_HID=y
        CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
        CONFIG_USB_CONFIGFS_F_ECM=y
        CONFIG_USB_CONFIGFS_F_ACM=y

        # Mac80211 Subsystem (Required for Injection)
        CONFIG_MAC80211=y
        CONFIG_MAC80211_RC_MINSTREL=y
        CONFIG_MAC80211_RC_MINSTREL_HT=y
        CONFIG_MAC80211_RC_MINSTREL_VHT=y
        CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
        CONFIG_MAC80211_MESH=y
        CONFIG_CFG80211=y
        
        # Prevent Native LED Calls
        # CONFIG_MAC80211_LEDS is not set

        # External Wi-Fi Adapters (Atheros & Realtek Enabled)
        CONFIG_WLAN_VENDOR_ATH=y
        CONFIG_ATH9K_HTC=m
        CONFIG_WLAN_VENDOR_REALTEK=y
        CONFIG_RTL8187=m
        
        # External BT & Networking
        CONFIG_BT_HCIBTUSB=m
        CONFIG_WIREGUARD=y
        
        # CPU Frequency Governors
        CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
        CONFIG_CPU_FREQ_GOV_POWERSAVE=y
        CONFIG_CPU_FREQ_GOV_USERSPACE=y
        CONFIG_CPU_FREQ_GOV_ONDEMAND=y
        CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y

        # Advanced Power Supply & Thermal Debugging
        CONFIG_POWER_SUPPLY_DEBUG=y
        CONFIG_DEBUG_FS=y
        CONFIG_THERMAL_GOV_USER_SPACE=y

        # BBR TCP Congestion Control
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_DEFAULT_BBR=y

        # TTL Modification
        CONFIG_NETFILTER_XT_TARGET_HL=y
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y

        # Native High-Capacity Drive Support
        CONFIG_NTFS3_FS=y
        CONFIG_EXFAT_FS=y
        CONFIG_ISO9660_FS=y
        CONFIG_UDF_FS=y
        EOF

    - name: Authorize Kali Symbols in GKI
      run: |
        cd workspace
        
        # 1. Create the master list of required Kali symbols
        cat << 'EOF' > missing_symbols.txt
        __dev_kfree_skb_irq
        __hci_cmd_sync
        __hci_cmd_sync_ev
        __printk_ratelimit
        __regmap_init
        bit_wait_timeout
        bt_err
        bt_info
        bt_to_errno
        bt_warn
        btbcm_set_bdaddr
        btbcm_setup_apple
        btbcm_setup_patchram
        device_release_driver
        gpiod_get_optional
        gpiod_put
        hci_alloc_dev_priv
        hci_cmd_sync
        hci_cmd_sync_cancel
        hci_free_dev
        hci_recv_diag
        hci_recv_frame
        hci_register_dev
        hci_unregister_dev
        out_of_line_wait_on_bit_timeout
        rfkill_pause_polling
        rhashtable_init
        skb_pull_data
        skb_unlink
        usb_alloc_urb
        usb_anchor_urb
        usb_autopm_get_interface
        usb_autopm_put_interface
        usb_bulk_msg
        usb_control_msg
        usb_deregister
        usb_driver_claim_interface
        usb_driver_release_interface
        usb_find_common_endpoints
        usb_free_urb
        usb_get_dev
        usb_get_from_anchor
        usb_get_urb
        usb_ifnum_to_if
        usb_interrupt_msg
        usb_kill_anchored_urbs
        usb_kill_urb
        usb_match_id
        usb_put_dev
        usb_queue_reset_device
        usb_register_driver
        usb_reset_device
        usb_scuttle_anchored_urbs
        usb_set_interface
        usb_submit_urb
        usb_unanchor_urb
        wake_up_bit
        EOF
        
        echo "Injecting missing symbols directly into Google's source whitelists..."
        
        # 2. Append them to the ACTUAL Google symbol lists across the entire workspace
        # We use grep -vE to strictly prevent touching Bazel scripts or code.
        find . -type f \( -name "abi_gki_aarch64*" -o -name "*symbol_list*" \) | grep -vE "\.(bzl|stg|xml|json|html|sh|py)$" | while read -r list_file; do
            echo "Updating $list_file"
            chmod u+w "$list_file" || true
            echo "" >> "$list_file"
            cat missing_symbols.txt >> "$list_file"
        done
        
    - name: Whitelist Custom Modules in Bazel
      run: |
        cd workspace
        # Download Google's buildozer tool to safely inject into Bazel manifests
        wget -qO buildozer https://github.com/bazelbuild/buildtools/releases/download/v7.1.2/buildozer-linux-amd64
        chmod +x buildozer
        
        # Add the newly compiled Kali modules to the shusky whitelist
        ./buildozer 'add module_outs drivers/bluetooth/btusb.ko drivers/net/wireless/ath/ath.ko drivers/net/wireless/ath/ath9k/ath9k_common.ko drivers/bluetooth/btintel.ko drivers/net/wireless/ath/ath9k/ath9k_hw.ko drivers/net/wireless/ath/ath9k/ath9k_htc.ko drivers/misc/eeprom/eeprom_93cx6.ko drivers/bluetooth/btrtl.ko drivers/net/wireless/realtek/rtl818x/rtl8187/rtl8187.ko' //private/devices/google/shusky:kernel

    - name: Compile Pixel 8 Pro Kernel
      run: |
         cd workspace
         # Native compilation. Disabling trimming and KMI checks using proper Bazel boolean syntax.
         BUILD_AOSP_KERNEL=1 EXTRA_ARGS="--notrim_nonlisted_kmi --nokmi_symbol_list_strict_mode" ./build_shusky.sh

    - name: Package Kernel (AK3) and Modules (KSU)
      run: |
         cd workspace

         # ==========================================
         # PART 1: PACKAGE THE KERNEL (AnyKernel3)
         # ==========================================
         rm -rf AnyKernel3 anykernel.zip
         wget -qO anykernel.zip https://github.com/osm0sis/AnyKernel3/archive/master.zip
         unzip -q anykernel.zip
         mv AnyKernel3-master AnyKernel3
         
         # Apply 64-bit Tensor G3 Fixes
         wget -qO AnyKernel3/tools/busybox https://raw.githubusercontent.com/xerta555/Busybox-Binaries/master/busybox-arm64
         chmod +x AnyKernel3/tools/busybox
         wget -qO magisk.zip https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
         unzip -j magisk.zip lib/arm64-v8a/libmagiskboot.so
         mv libmagiskboot.so AnyKernel3/tools/magiskboot
         chmod +x AnyKernel3/tools/magiskboot
         rm magisk.zip
         
         # Copy the Kernel AND the matched GKI hardware drivers into the zip!
         cp out/shusky/dist/Image.lz4 AnyKernel3/
         cp out/shusky/dist/vendor_dlkm.img AnyKernel3/ 2>/dev/null || true
         cp out/shusky/dist/system_dlkm.img AnyKernel3/ 2>/dev/null || true
         
         # Generate Multi-Partition AnyKernel script
         cat << 'EOF' > AnyKernel3/anykernel.sh
         ### AnyKernel3 Mod Script
         properties() { '
         kernel.string=Tweakers Paradise NetHunter Kernel
         do.devicecheck=0
         do.modules=0
         do.systemless=1
         do.cleanup=1
         do.cleanuponabort=0
         device.name1=husky
         device.name2=shiba
         device.name3=shusky
         '; }
         
         # 1. Flash the core Kernel (boot)
         block=boot;
         is_slot_device=1;
         ramdisk_compression=auto;
         patch_vbmeta_flag=auto;
         . tools/ak3-core.sh;
         split_boot;
         flash_boot;
         
         # 2. Flash the matched hardware drivers (vendor_dlkm)
         if [ -f "$home/vendor_dlkm.img" ]; then
             reset_ak;
             block=vendor_dlkm;
             is_slot_device=1;
             . tools/ak3-core.sh;
             flash_generic vendor_dlkm;
         fi
         
         # 3. Flash the matched system drivers (system_dlkm)
         if [ -f "$home/system_dlkm.img" ]; then
             reset_ak;
             block=system_dlkm;
             is_slot_device=1;
             . tools/ak3-core.sh;
             flash_generic system_dlkm;
         fi
         EOF
         
         # Zip the final AK3 Flasher
         cd AnyKernel3
         zip -r9 ../Tweakers-Paradise-Kernel-Pixel8Pro.zip * -x README.md
         cd ..
         
                
         # ==========================================
         # PART 2: PACKAGE THE KALI DRIVERS (KernelSU)
         # ==========================================
         mkdir -p ksu-module/system/vendor/lib/modules
         
         # Copy all compiled .ko drivers from Bazel output
         cp out/shusky/dist/*.ko ksu-module/system/vendor/lib/modules/ 2>/dev/null || true
         
         # Generate KernelSU module properties
         cat << 'EOF' > ksu-module/module.prop
         id=nethunter-modules-shusky
         name=NetHunter Tensor G3 Modules
         version=v1.0
         versionCode=1
         author=Tweakers Paradise
         description=Kali NetHunter Wi-Fi Injection and Bluetooth Modules for Pixel 8 Pro.
         EOF
         
         # Zip the final KSU Module
         cd ksu-module
         zip -r9 ../NetHunter-Modules-KSU.zip *
         cd ..

    - name: Upload Kernel Artifact (AK3)
      uses: actions/upload-artifact@v4
      with:
        name: Tweakers-Paradise-Kernel
        path: workspace/Tweakers-Paradise-Kernel-Pixel8Pro.zip

    - name: Upload Modules Artifact (KSU)
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-KSU-Modules
        path: workspace/NetHunter-Modules-KSU.zip

    - name: Upload Matched GKI Drivers (vendor_dlkm)
      uses: actions/upload-artifact@v4
      with:
        name: Matched-GKI-Drivers
        path: |
          workspace/out/shusky/dist/vendor_dlkm.img
          workspace/out/shusky/dist/system_dlkm.img
