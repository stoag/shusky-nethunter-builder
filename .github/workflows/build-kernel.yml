name: Build Pixel 8 Pro (shusky) - NetHunter + KernelSU-Next (v1.31)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      CUSTOM_KERNEL_VERSION: "1.31"

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential curl flex bison libssl-dev libelf-dev python3 repo git zip libncurses5-dev wget

      - name: Configure Git Credentials
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@localhost"

      - name: Cache Bazel & Kleaf Build Output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            workspace/out/bazel
          key: ${{ runner.os }}-bazel-shusky-${{ hashFiles('workspace/private/devices/google/shusky/**') }}
          restore-keys: |
            ${{ runner.os }}-bazel-shusky-

      - name: Initialize & Sync Google Kernel Source
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b android-gs-shusky-6.1-android16 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Apply Kali NetHunter Subsystem Overrides
        run: |
          cd workspace/aosp
          # Disable MAC80211 LEDs in Kconfig to prevent GKI symbol linker panics
          find drivers/net/wireless -name "Kconfig" -exec sed -i '/select MAC80211_LEDS/d' {} +
          sed -i 's/config MAC80211_LEDS/config MAC80211_LEDS\n\tdepends on BROKEN/g' net/mac80211/Kconfig

      - name: Inject Morrownr Linux 6.1-Ready Driver (8812AU)
        run: |
          cd workspace/aosp
          chmod u+w drivers/net/wireless/realtek/Makefile
          rm -rf drivers/net/wireless/realtek/rtw88 drivers/net/wireless/realtek/rtl8812au

          mkdir -p drivers/net/wireless/realtek/rtw88
          touch drivers/net/wireless/realtek/rtw88/Kconfig

          git clone https://github.com/stoag/8812au-20210820.git drivers/net/wireless/realtek/rtl8812au
          rm -rf drivers/net/wireless/realtek/rtl8812au/.git

          sed -i 's/CONFIG_RTW_NAPI = y/CONFIG_RTW_NAPI = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile
          sed -i 's/CONFIG_RTW_GRO = y/CONFIG_RTW_GRO = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile
          sed -i 's/CONFIG_RTW_NETIF_SG = y/CONFIG_RTW_NETIF_SG = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile
          sed -i 's/CONFIG_LOAD_PHY_PARA_FROM_FILE = y/CONFIG_LOAD_PHY_PARA_FROM_FILE = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile

          # Strictly disable Concurrent Mode to prevent runtime crashes on the 8812AU
          sed -i 's/ccflags-y += -DCONFIG_CONCURRENT_MODE/#ccflags-y += -DCONFIG_CONCURRENT_MODE/g' drivers/net/wireless/realtek/rtl8812au/Makefile

          echo 'ccflags-y += -DCONFIG_USE_USB_BUFFER_ALLOC_TX -DCONFIG_USE_USB_BUFFER_ALLOC_RX' >> drivers/net/wireless/realtek/rtl8812au/Makefile
          echo 'obj-y += rtl8812au/' >> drivers/net/wireless/realtek/Makefile
          echo 'obj-m := $(MODULE_NAME).o' >> drivers/net/wireless/realtek/rtl8812au/Makefile

      - name: Apply KernelSU-Next & NetHunter Configs
        run: |
          cd workspace/aosp
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

          KSU_GIT_VER=$(git -C KernelSU-Next rev-list --count HEAD)
          KSU_TAG=$(git -C KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo "v3.4.2")

          sed -i "s/KSU_GIT_VERSION := .*/KSU_GIT_VERSION := ${KSU_GIT_VER}/g" KernelSU-Next/kernel/Kbuild
          sed -i "s/KSU_VERSION_TAG := .*/KSU_VERSION_TAG := ${KSU_TAG}/g" KernelSU-Next/kernel/Kbuild
          sed -i "1i KSU_GIT_VERSION := ${KSU_GIT_VER}\nKSU_GIT_VERSION_VALID := 1\nKSU_GIT_TAG := ${KSU_TAG}\nKSU_VERSION_TAG := ${KSU_TAG}" KernelSU-Next/kernel/Kbuild

          chmod u+w build.config.gki
          echo "DEFCONFIG=gki_defconfig" > build.config.gki

          chmod u+w arch/arm64/configs/gki_defconfig
          {
            echo 'CONFIG_LOCALVERSION="-twk.v${{ env.CUSTOM_KERNEL_VERSION }}"'
            echo 'CONFIG_KSU=y'
            echo 'CONFIG_TRIM_NONLISTED_KMI=n'

            # Task & VM Accounting
            echo 'CONFIG_TASKSTATS=y'
            echo 'CONFIG_TASK_DELAY_ACCT=y'
            echo 'CONFIG_TASK_XACCT=y'
            echo 'CONFIG_TASK_IO_ACCOUNTING=y'
            echo 'CONFIG_VM_EVENT_COUNTERS=y'

            # USB ConfigFS & HID Arsenal
            echo 'CONFIG_CONFIGFS_FS=y'
            echo 'CONFIG_USB_CONFIGFS=y'
            echo 'CONFIG_USB_GADGETFS=y'
            echo 'CONFIG_USB_CONFIGFS_F_HID=y'
            echo 'CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y'
            echo 'CONFIG_USB_CONFIGFS_F_ECM=y'
            echo 'CONFIG_USB_CONFIGFS_F_ACM=y'
            echo 'CONFIG_USB_CONFIGFS_RNDIS=y'
            echo 'CONFIG_USB_CONFIGFS_NCM=y'

            # Netfilter, AFWall+ Logging, NAT & Hotspot TTL/HL
            echo 'CONFIG_NETFILTER_NETLINK_LOG=y'
            echo 'CONFIG_NETFILTER_NETLINK_QUEUE=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_LOG=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_NFLOG=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_OWNER=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_STATE=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_MARK=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_MARK=y'
            echo 'CONFIG_IP_NF_NAT=y'
            echo 'CONFIG_IP6_NF_NAT=y'
            echo 'CONFIG_IP_NF_MANGLE=y'
            echo 'CONFIG_IP6_NF_MANGLE=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_HL=y'
            echo 'CONFIG_IP_NF_TARGET_TTL=y'
            echo 'CONFIG_IP6_NF_TARGET_HL=y'
            echo 'CONFIG_WIREGUARD=y'
            echo 'CONFIG_TCP_CONG_BBR=y'

            # Native Filesystems
            echo 'CONFIG_NTFS3_FS=y'
            echo 'CONFIG_ISO9660_FS=y'
            echo 'CONFIG_UDF_FS=y'
            echo 'CONFIG_SQUASHFS=y'
            echo 'CONFIG_SQUASHFS_XZ=y'
            echo 'CONFIG_SQUASHFS_ZSTD=y'

            # Containers & Namespaces
            echo 'CONFIG_UTS_NS=y'
            echo 'CONFIG_IPC_NS=y'
            echo 'CONFIG_PID_NS=y'
            echo 'CONFIG_USER_NS=y'
            echo 'CONFIG_MACVLAN=y'

            # CPU Governor & Power/Thermal Telemetry
            echo 'CONFIG_CPU_FREQ_GOV_ONDEMAND=y'
            echo 'CONFIG_POWER_SUPPLY_DEBUG=y'
            echo 'CONFIG_THERMAL_GOV_USER_SPACE=y'

            # Wireless & Bluetooth
            echo 'CONFIG_CFG80211=y'
            echo 'CONFIG_MAC80211=y'
            echo 'CONFIG_CFG80211_CERTIFICATION_ONUS=y'
            echo 'CONFIG_WIRELESS=y'
            echo 'CONFIG_WLAN_VENDOR_REALTEK=y'
            echo 'CONFIG_WLAN_VENDOR_MEDIATEK=y'
            echo 'CONFIG_MT76_CORE=m'
            echo 'CONFIG_MT76_USB=m'
            echo 'CONFIG_MT76x02_LIB=m'
            echo 'CONFIG_MT76x02_USB=m'
            echo 'CONFIG_MT76x2_COMMON=m'
            echo 'CONFIG_MT76x2U=m'
            echo 'CONFIG_BT_HCIBTUSB=m'

            # USB Serial, Ethernet & SocketCAN Dongles
            echo 'CONFIG_USB_ACM=m'
            echo 'CONFIG_USB_SERIAL=m'
            echo 'CONFIG_USB_SERIAL_CH341=m'
            echo 'CONFIG_USB_SERIAL_CP210X=m'
            echo 'CONFIG_USB_NET_AX88179_178A=m'
            echo 'CONFIG_CAN=m'
            echo 'CONFIG_CAN_RAW=m'
            echo 'CONFIG_CAN_SLCAN=m'
            echo 'CONFIG_CAN_GS_USB=m'
          } >> arch/arm64/configs/gki_defconfig

      - name: Authorize NetHunter Symbols in GKI
        run: |
          cd workspace
          {
            echo '_bcd2bin'
            echo '__dev_kfree_skb_irq'
            echo '__hci_cmd_sync'
            echo '__hci_cmd_sync_ev'
            echo '__ioread32_copy'
            echo '__iowrite32_copy'
            echo '__printk_ratelimit'
            echo '__pskb_copy_fclone'
            echo '__regmap_init'
            echo 'bit_wait_timeout'
            echo 'bt_err'
            echo 'bt_info'
            echo 'bt_to_errno'
            echo 'bt_warn'
            echo 'btbcm_set_bdaddr'
            echo 'btbcm_setup_apple'
            echo 'btbcm_setup_patchram'
            echo 'dev_coredumpv'
            echo 'dev_set_threaded'
            echo 'device_release_driver'
            echo 'firmware_request_cache'
            echo 'flush_signals'
            echo 'gpiod_get_optional'
            echo 'gpiod_put'
            echo 'hci_alloc_dev_priv'
            echo 'hci_cmd_sync'
            echo 'hci_cmd_sync_cancel'
            echo 'hci_free_dev'
            echo 'hci_recv_diag'
            echo 'hci_recv_frame'
            echo 'hci_register_dev'
            echo 'hci_unregister_dev'
            echo 'iwe_stream_add_event'
            echo 'iwe_stream_add_point'
            echo 'kern_path'
            echo 'kernel_sigaction'
            echo 'kill_pid'
            echo 'led_trigger_blink'
            echo 'led_trigger_blink_oneshot'
            echo 'of_get_mac_address'
            echo 'out_of_line_wait_on_bit_timeout'
            echo 'pci_disable_link_state'
            echo 'pcie_capability_clear_and_set_word'
            echo 'proc_get_parent_data'
            echo 'radix_tree_tagged'
            echo 'rfkill_pause_polling'
            echo 'rhashtable_init'
            echo 'sched_set_fifo_low'
            echo 'skb_pull_data'
            echo 'skb_to_sgvec'
            echo 'skb_unlink'
            echo 'stpcpy'
            echo 'usb_alloc_coherent'
            echo 'usb_alloc_urb'
            echo 'usb_anchor_urb'
            echo 'usb_autopm_get_interface'
            echo 'usb_autopm_put_interface'
            echo 'usb_bulk_msg'
            echo 'usb_control_msg'
            echo 'usb_deregister'
            echo 'usb_driver_claim_interface'
            echo 'usb_driver_release_interface'
            echo 'usb_find_common_endpoints'
            echo 'usb_free_coherent'
            echo 'usb_free_urb'
            echo 'usb_get_dev'
            echo 'usb_get_from_anchor'
            echo 'usb_get_urb'
            echo 'usb_ifnum_to_if'
            echo 'usb_init_urb'
            echo 'usb_interrupt_msg'
            echo 'usb_kill_anchored_urbs'
            echo 'usb_kill_urb'
            echo 'usb_match_id'
            echo 'usb_poison_urb'
            echo 'usb_put_dev'
            echo 'usb_queue_reset_device'
            echo 'usb_register_driver'
            echo 'usb_reset_device'
            echo 'usb_scuttle_anchored_urbs'
            echo 'usb_set_interface'
            echo 'usb_submit_urb'
            echo 'usb_unanchor_urb'
            echo 'usb_unpoison_urb'
            echo 'wake_up_bit'
            echo 'yield'
          } > missing_symbols.txt

          for list_file in aosp/android/abi_gki_aarch64 aosp/android/abi_gki_aarch64_pixel aosp/android/abi_gki_aarch64_core aosp/android/abi_gki_aarch64_virtual_device; do
            if [ -f "$list_file" ]; then
              chmod u+w "$list_file" || true
              echo "" >> "$list_file"
              cat missing_symbols.txt >> "$list_file"
            fi
          done

      - name: Track New Modules in Bazel (@//aosp:kernel_aarch64 & dist)
        run: |
          cd workspace
          chmod u+w build/bazel_common_rules/dist/dist.bzl
          sed -i 's/allow_duplicate_filenames = False/allow_duplicate_filenames = True/g' build/bazel_common_rules/dist/dist.bzl

          wget -qO buildozer https://github.com/bazelbuild/buildtools/releases/latest/download/buildozer-linux-amd64
          chmod +x buildozer
          ./buildozer 'set allow_duplicate_filenames True' //private/devices/google/shusky:%copy_to_dist_dir //private/devices/google/zuma:%copy_to_dist_dir || true
          ./buildozer 'add module_outs drivers/net/wireless/realtek/rtl8812au/8812au.ko drivers/bluetooth/btrtl.ko drivers/bluetooth/btusb.ko drivers/bluetooth/btintel.ko drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2-common.ko drivers/net/wireless/mediatek/mt76/mt76.ko drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko drivers/net/wireless/mediatek/mt76/mt76-usb.ko drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko drivers/usb/serial/ch341.ko drivers/usb/serial/cp210x.ko drivers/net/can/usb/gs_usb.ko' //private/devices/google/shusky:kernel

      - name: Compile Pixel 8 Pro Kernel via Bazel
        run: |
          cd workspace
          # Ensure fips140 prebuilt download is disabled in WORKSPACE / common rules if present
          ./build_shusky.sh \
            --kernel_package=@//aosp \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --no//private/devices/google/common:download_prebuilt_gki_fips140 \
            --notrim_nonlisted_kmi \
            --nokmi_symbol_list_strict_mode \
            --//build/kernel/kleaf:kbuild_build_user=Tweaker \
            --//build/kernel/kleaf:kbuild_build_host=twk-v${{ env.CUSTOM_KERNEL_VERSION }}" ./build_shusky.sh

      - name: Package Flat Release Bundle (AK3 Zip + 3 Partition Images)
        run: |
          cd workspace
          rm -rf bundle AnyKernel3
          git clone https://github.com/stoag/AnyKernel3-Pixel8Pro.git AnyKernel3
          mkdir -p bundle AnyKernel3/twk_drivers AnyKernel3/twk_firmware

          wget -qO AnyKernel3/tools/busybox https://raw.githubusercontent.com/xerta555/Busybox-Binaries/master/busybox-arm64
          chmod +x AnyKernel3/tools/busybox
          wget -qO magisk.zip https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -j magisk.zip lib/arm64-v8a/libmagiskboot.so
          mv libmagiskboot.so AnyKernel3/tools/magiskboot
          chmod +x AnyKernel3/tools/magiskboot
          rm -f magisk.zip

          cp -L out/shusky/dist/Image.lz4 AnyKernel3/

          # Download MediaTek & Ralink firmware binaries with fallbacks
          FW_URL="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain"
          for fw in mt7662.bin mt7662_rom_patch.bin mt7662u.bin mt7662u_rom_patch.bin; do
            curl -fLSs "$FW_URL/mediatek/$fw" -o "AnyKernel3/twk_firmware/$fw" || curl -fLSs "$FW_URL/$fw" -o "AnyKernel3/twk_firmware/$fw" || true
          done
          curl -fLSs "$FW_URL/rt2870.bin" -o AnyKernel3/twk_firmware/rt2870.bin || true

          # Copy stripped production .ko modules (Wi-Fi, BT, USB Serial, USB Ethernet, SocketCAN)
          MODULES="8812au.ko mt76.ko mt76-usb.ko mt76x02-lib.ko mt76x02-usb.ko mt76x2-common.ko mt76x2u.ko btintel.ko btrtl.ko btusb.ko cdc-acm.ko usbserial.ko ch341.ko cp210x.ko ftdi_sio.ko ax88179_178a.ko r8152.ko can.ko can-raw.ko can-dev.ko slcan.ko gs_usb.ko"
          for ko in $MODULES; do
            if [ -f "out/shusky/dist/$ko" ]; then
              cp -L "out/shusky/dist/$ko" AnyKernel3/twk_drivers/
            else
              find out/ -path "*/dist/$ko" -exec cp -L {} AnyKernel3/twk_drivers/ \; -quit 2>/dev/null || true
            fi
          done

          echo "VERIFYING STRIPPED DRIVERS & FIRMWARE:"
          ls -lh AnyKernel3/twk_drivers/
          ls -lh AnyKernel3/twk_firmware/

          sed -i "s/kernel.string=.*/kernel.string=Tweaker Kernel (v${{ env.CUSTOM_KERNEL_VERSION }})/g" AnyKernel3/anykernel.sh

          {
            echo '# --- TWEAKER KERNEL NON-SHADOWING ADAPTER INJECTION ---'
            echo 'ui_print " ";'
            echo 'ui_print "- Staging Non-Shadowing NetHunter Drivers & Firmware...";'
            echo 'mount /data;'
            echo 'MOD_DIR="/data/adb/modules/twk_nethunter_adapters"'
            echo 'rm -rf $MOD_DIR'
            echo 'mkdir -p $MOD_DIR/twk_firmware $MOD_DIR/twk_modules'
            echo 'cp -f $home/twk_firmware/*.bin $MOD_DIR/twk_firmware/'
            echo 'cp -f $home/twk_drivers/*.ko $MOD_DIR/twk_modules/'
            echo 'echo "id=twk_nethunter_adapters" > $MOD_DIR/module.prop'
            echo 'echo "name=Tweaker Kernel Adapters" >> $MOD_DIR/module.prop'
            echo 'echo "version=v${{ env.CUSTOM_KERNEL_VERSION }}" >> $MOD_DIR/module.prop'
            echo 'echo "versionCode=131" >> $MOD_DIR/module.prop'
            echo 'echo "author=Tweaker" >> $MOD_DIR/module.prop'
            echo 'echo "description=Non-shadowing RAM-disk firmware and modular drivers." >> $MOD_DIR/module.prop'
            echo 'echo "#!/system/bin/sh" > $MOD_DIR/service.sh'
            echo 'echo "MOD_DIR=/data/adb/modules/twk_nethunter_adapters" >> $MOD_DIR/service.sh'
            echo 'echo "until [ \"\$(getprop sys.boot_completed)\" = \"1\" ]; do sleep 2; done" >> $MOD_DIR/service.sh'
            echo 'echo "mkdir -p /dev/twk_modules /dev/twk_firmware" >> $MOD_DIR/service.sh'
            echo 'echo "LOG=/dev/twk_modules/load.log" >> $MOD_DIR/service.sh'
            echo 'echo "ln -sf /vendor/firmware/* /dev/twk_firmware/ 2>/dev/null || true" >> $MOD_DIR/service.sh'
            echo 'echo "ln -sf /vendor/firmware/mediatek/* /dev/twk_firmware/ 2>/dev/null || true" >> $MOD_DIR/service.sh'
            echo 'echo "cp -f \$MOD_DIR/twk_firmware/*.bin /dev/twk_firmware/ 2>/dev/null || true" >> $MOD_DIR/service.sh'
            echo 'echo "cp -f \$MOD_DIR/twk_modules/*.ko /dev/twk_modules/ 2>/dev/null || true" >> $MOD_DIR/service.sh'
            echo 'echo "echo -n \"/dev/twk_firmware\" > /sys/module/firmware_class/parameters/path" >> $MOD_DIR/service.sh'
            echo 'echo "for m in btintel.ko btrtl.ko btusb.ko mt76.ko mt76-usb.ko mt76x02-lib.ko mt76x02-usb.ko mt76x2-common.ko mt76x2u.ko cdc-acm.ko usbserial.ko ch341.ko cp210x.ko ftdi_sio.ko ax88179_178a.ko r8152.ko can.ko can-raw.ko can-dev.ko slcan.ko gs_usb.ko; do" >> $MOD_DIR/service.sh'
            echo 'echo "  [ -f \"/dev/twk_modules/\$m\" ] && insmod \"/dev/twk_modules/\$m\" >> \"\$LOG\" 2>&1 || true" >> $MOD_DIR/service.sh'
            echo 'echo "done" >> $MOD_DIR/service.sh'
            echo 'echo "[ -f /dev/twk_modules/8812au.ko ] && insmod /dev/twk_modules/8812au.ko rtw_drv_log_level=6 rtw_power_mgnt=0 rtw_switch_usb_mode=0 >> \"\$LOG\" 2>&1 || true" >> $MOD_DIR/service.sh'
            echo 'chmod +x $MOD_DIR/service.sh'
            echo 'ui_print "- Non-shadowing drivers & firmware staged successfully!";'
          } >> AnyKernel3/anykernel.sh

          # Build versioned AK3 zip into bundle/
          (cd AnyKernel3 && zip -r9 "../bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-anykernel3.zip" * -x .git README.md)

          # Copy the 3 partition images into bundle/
          for img in vendor_kernel_boot.img vendor_dlkm.img system_dlkm.img; do
            if [ -f "out/shusky/dist/$img" ]; then
              cp -L "out/shusky/dist/$img" "bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-$img"
            else
              find out/ -type f -name "$img" -exec cp -L {} "bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-$img" \; -quit
            fi
          done

          echo "FINAL FLAT RELEASE BUNDLE CONTENTS:"
          ls -lh bundle/

      - name: Upload Flat Release Bundle (Single Zip)
        uses: actions/upload-artifact@v4
        with:
          name: twk-v${{ env.CUSTOM_KERNEL_VERSION }}-release-package
          path: workspace/bundle/*
          if-no-files-found: error

      - name: Ping Phone - Success
        if: success()
        run: curl -d "✅ Pixel 8 Pro Kernel Build (v${{ env.CUSTOM_KERNEL_VERSION }}) COMPLETE! Grab the release zip." https://ntfy.sh/twk_pixel8_build_alerts

      - name: Ping Phone - Failure
        if: failure()
        run: curl -d "❌ Pixel 8 Pro Kernel Build (v${{ env.CUSTOM_KERNEL_VERSION }}) FAILED! Check the logs." https://ntfy.sh/twk_pixel8_build_alerts
# END OF WORKFLOW