- name: Track Morrownr Monolithic Module in Bazel
      run: |
        cd workspace/aosp
        
        wget -qO buildozer https://github.com/bazelbuild/buildtools/releases/latest/download/buildozer-linux-amd64
        chmod +x buildozer
        
        ./buildozer 'add module_outs drivers/net/wireless/realtek/rtl8812au/8812au.ko drivers/bluetooth/btrtl.ko drivers/bluetooth/btusb.ko drivers/bluetooth/btintel.ko' //private/devices/google/shusky:kernel
        
    - name: Upload Build Script as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pixel-build-script
        path: workspace/build_shusky.sh
          
    - name: Compile Pixel 8 Pro Kernel via Bazel      
      run: |        
        cd workspace
        BUILD_AOSP_KERNEL=1 EXTRA_ARGS="--notrim_nonlisted_kmi --nokmi_symbol_list_strict_mode --//build/kernel/kleaf:kbuild_build_user=Tweaker --//build/kernel/kleaf:kbuild_build_host=twk-v${{ env.CUSTOM_KERNEL_VERSION }}" ./build_shusky.sh
