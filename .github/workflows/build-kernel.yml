name: Build Pixel 8 Pro (shusky) Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    env:
      CUSTOM_KERNEL_VERSION: 1.25

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        docker system prune -a -f

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc flex bison libssl-dev python3 git zip libncurses-dev
        
        # Install repo
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync Google Pixel Kernel Source (Shusky)
      run: |
        mkdir workspace
        cd workspace
        # Syncing android14-6.1 for Pixel 8 Pro
        repo init -u https://android.googlesource.com/kernel/manifest -b android14-6.1 --depth=1
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    - name: Inject MediaTek (MT76) & Bluetooth Firmware for RAM Disk
      run: |
        cd workspace
        mkdir -p private/devices/google/shusky/vendor_dlkm/firmware/mediatek
        
        # Download strictly the NON-u variants required by the driver
        wget -qO private/devices/google/shusky/vendor_dlkm/firmware/mediatek/mt7662_rom_patch.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662_rom_patch.bin
        wget -qO private/devices/google/shusky/vendor_dlkm/firmware/mediatek/mt7662.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662.bin
        
        # Download the 'u' variants as well, just in case
        wget -qO private/devices/google/shusky/vendor_dlkm/firmware/mediatek/mt7662u_rom_patch.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662u_rom_patch.bin
        wget -qO private/devices/google/shusky/vendor_dlkm/firmware/mediatek/mt7662u.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662u.bin

        mkdir -p private/devices/google/shusky/vendor_dlkm/firmware
        wget -qO private/devices/google/shusky/vendor_dlkm/firmware/rt2870.bin https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2870.bin

    - name: Patch Kconfig for MAC80211 LED linker conflict
      run: |
        cd workspace/private/devices/google/shusky
        echo 'CONFIG_MAC80211_LEDS=y' >> shusky.fragment

    - name: Configure NetHunter & Wireless Kernel Flags
      run: |
        cd workspace/private/devices/google/shusky
        {
          echo 'CONFIG_MODULES=y'
          echo 'CONFIG_MAC80211=y'
          echo 'CONFIG_CFG80211=y'
          echo 'CONFIG_WLAN=y'
          echo 'CONFIG_WLAN_VENDOR_REALTEK=y'
          echo 'CONFIG_WLAN_VENDOR_MEDIATEK=y'
          echo 'CONFIG_MT76_USB=m'
          echo 'CONFIG_MT76x02_USB=m'
          echo 'CONFIG_MT76x2_COMMON=m'
          echo 'CONFIG_MT76x2U=m'
          echo 'CONFIG_MT76_LEDS=n'
          echo 'CONFIG_BT=y'
          echo 'CONFIG_BT_RFCOMM=y'
          echo 'CONFIG_BT_RFCOMM_TTY=y'
          echo 'CONFIG_BT_BNEP=y'
          echo 'CONFIG_BT_BNEP_MC_FILTER=y'
          echo 'CONFIG_BT_BNEP_PROTO_FILTER=y'
          echo 'CONFIG_BT_HIDP=y'
          echo 'CONFIG_BT_HCIBTUSB=m'
          echo 'CONFIG_BT_HCIBTUSB_AUTOSUSPEND=y'
          echo 'CONFIG_BT_HCIBTUSB_BCM=y'
          echo 'CONFIG_BT_HCIBTUSB_MTK=y'
          echo 'CONFIG_BT_HCIBTUSB_RTL=y'
          echo 'CONFIG_MAC80211_MESH=y'
          echo 'CONFIG_USB_CONFIGFS=y'
          echo 'CONFIG_USB_CONFIGFS_F_HID=y'
          echo 'CONFIG_USB_CONFIGFS_NCM=y'
          echo 'CONFIG_USB_CONFIGFS_MASS_STORAGE=y'
          echo 'CONFIG_NF_CONNTRACK=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_NFLOG=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_OWNER=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_STATE=y'
          echo 'CONFIG_NETFILTER_XT_MATCH_MARK=y'
          echo 'CONFIG_NETFILTER_XT_TARGET_MARK=y'
          echo 'CONFIG_NF_NAT=y'
          echo 'CONFIG_IP_NF_NAT=y'
          echo 'CONFIG_IP_NF_MANGLE=y'
          echo 'CONFIG_IP6_NF_MANGLE=y'
          echo 'CONFIG_WIREGUARD=y'
        } >> Kconfig.ext

    - name: Clone Realtek 8812au & KernelSU-Next
      run: |
        cd workspace
        
        # KernelSU-Next
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
        
        # Create driver path
        mkdir -p private/google-modules/wlan/realtek
        cd private/google-modules/wlan/realtek
        
        # Clone your specific 8812au driver fork
        git clone https://github.com/stoag/8812au-20210820.git rtl8812au
        cd rtl8812au
        rm -rf .git
        
        # Natively suppress compiler warnings that cause GKI strict Clang to crash
        sed -i 's/EXTRA_CFLAGS += -O3/EXTRA_CFLAGS += -O3 -Wno-switch-bool -Wno-parentheses-equality/' Makefile

    - name: Inject 8812AU into GKI Build Graph
      run: |
        cd workspace
        echo 'obj-y += realtek/' >> private/google-modules/wlan/Makefile
        echo 'obj-m += rtl8812au/' > private/google-modules/wlan/realtek/Makefile

    - name: Override savedefconfig protection
      run: |
        cd workspace
        sed -i 's/UPDATE_DEFCONFIG_ARGS="--werror"/UPDATE_DEFCONFIG_ARGS=""/' aosp/build.config.gki

    - name: Update ABI Symbol List
      run: |
        cd workspace
        {
          echo '_bcd2bin'
          echo '__dev_kfree_skb_irq'
          echo '__hci_cmd_sync'
          echo '__hci_cmd_sync_ev'
          echo '__ioread32_copy'
          echo '__iowrite32_copy'
          echo '__printk_ratelimit'
          echo '__pskb_copy_fclone'
          echo '__regmap_init'
          echo 'bit_wait_timeout'
          echo 'bt_err'
          echo 'bt_info'
          echo 'bt_to_errno'
          echo 'bt_warn'
          echo 'btbcm_set_bdaddr'
          echo 'btbcm_setup_apple'
          echo 'btbcm_setup_patchram'
          echo 'dev_coredumpv'
          echo 'dev_set_threaded'
          echo 'device_release_driver'
          echo 'flush_signals'
          echo 'gpiod_get_optional'
          echo 'gpiod_put'
          echo 'hci_alloc_dev_priv'
          echo 'hci_cmd_sync'
          echo 'hci_cmd_sync_cancel'
          echo 'hci_free_dev'
          echo 'hci_recv_diag'
          echo 'hci_recv_frame'
          echo 'hci_register_dev'
          echo 'hci_unregister_dev'
          echo 'iwe_stream_add_event'
          echo 'iwe_stream_add_point'
          echo 'kern_path'
          echo 'kernel_sigaction'
          echo 'kill_pid'
          echo 'led_trigger_blink'
          echo 'led_trigger_blink_oneshot'
          echo 'of_get_mac_address'
          echo 'out_of_line_wait_on_bit_timeout'
          echo 'pci_disable_link_state'
          echo 'pcie_capability_clear_and_set_word'
          echo 'proc_get_parent_data'
          echo 'radix_tree_tagged'
          echo 'rfkill_pause_polling'
          echo 'rhashtable_init'
          echo 'sched_set_fifo_low'
          echo 'skb_pull_data'
          echo 'skb_to_sgvec'
          echo 'skb_unlink'
          echo 'stpcpy'
          echo 'usb_alloc_coherent'
          echo 'usb_alloc_urb'
          echo 'usb_anchor_urb'
          echo 'usb_autopm_get_interface'
          echo 'usb_autopm_put_interface'
          echo 'usb_bulk_msg'
          echo 'usb_control_msg'
          echo 'usb_deregister'
          echo 'usb_driver_claim_interface'
          echo 'usb_driver_release_interface'
          echo 'usb_find_common_endpoints'
          echo 'usb_free_coherent'
          echo 'usb_free_urb'
          echo 'usb_get_dev'
          echo 'usb_get_from_anchor'
          echo 'usb_get_urb'
          echo 'usb_ifnum_to_if'
          echo 'usb_init_urb'
          echo 'usb_interrupt_msg'
          echo 'usb_kill_anchored_urbs'
          echo 'usb_kill_urb'
          echo 'usb_match_id'
          echo 'usb_poison_urb'
          echo 'usb_put_dev'
          echo 'usb_queue_reset_device'
          echo 'usb_register_driver'
          echo 'usb_reset_device'
          echo 'usb_scuttle_anchored_urbs'
          echo 'usb_set_interface'
          echo 'usb_submit_urb'
          echo 'usb_unanchor_urb'
          echo 'usb_unpoison_urb'
          echo 'wake_up_bit'
          echo 'yield'
        } > missing_symbols.txt
        
        find . -type f \( -name "abi_gki_aarch64*" -o -name "*symbol_list*" \) ! -name "*.bzl" ! -name "*.py" ! -name "*.sh" -exec sh -c 'cat missing_symbols.txt >> "{}"' \;

    - name: Track Loadable Modules in Bazel
      run: |
        cd workspace/aosp

        # 1. Register all 12 compiled modules in @//aosp:kernel_aarch64 (passes step [514 / 572])
        chmod u+w modules.bzl
        sed -i '/COMMON_GKI_MODULES_LIST = \[/a \    "drivers/bluetooth/btintel.ko",\n    "drivers/bluetooth/btrtl.ko",\n    "drivers/bluetooth/btusb.ko",\n    "drivers/net/wireless/mediatek/mt76/mt76.ko",\n    "drivers/net/wireless/mediatek/mt76/mt76-usb.ko",\n    "drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko",\n    "drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko",\n    "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2-common.ko",\n    "drivers/net/wireless/mediatek/mt76/mt76x2/mt76x2u.ko",\n    "drivers/net/wireless/realtek/rtl8812au/8812au.ko",\n    "net/mac80211/mac80211.ko",\n    "net/wireless/cfg80211.ko",' modules.bzl

        # 2. Remove duplicate mac80211.ko and cfg80211.ko exports from device Starlark files
        find ../private/devices/google -type f \( -name "*.bzl" -o -name "BUILD.bazel" \) -exec sed -i '/"net\/mac80211\/mac80211.ko",/d; /"net\/wireless\/cfg80211.ko",/d' {} +

        # 3. Safely enable allow_duplicate_filenames in dist.bzl without touching .append()
        chmod u+w ../build/bazel_common_rules/dist/dist.bzl
        sed -i 's/allow_duplicate_filenames = False/allow_duplicate_filenames = True/g' ../build/bazel_common_rules/dist/dist.bzl

    - name: Generate KernelSU SELinux & Firmware Loading Script
      run: |
        cd workspace
        mkdir -p kernelsu_overlay/system/vendor/lib/modules
        
        cat << 'EOF' > kernelsu_overlay/service.sh
        #!/system/bin/sh
        
        # 1. Mount custom firmware directory over the native firmware path using magic KernelSU mounts
        mkdir -p /dev/twk_firmware
        cp /data/adb/modules/twk_nethunter_adapters/system/vendor/firmware/mediatek/* /dev/twk_firmware/
        cp /data/adb/modules/twk_nethunter_adapters/system/vendor/firmware/rt2870.bin /dev/twk_firmware/
        chcon u:object_r:vendor_file:s0 /dev/twk_firmware/*
        mount -o bind /dev/twk_firmware /vendor/firmware
        
        # 2. Insmod the newly compiled adapters
        MOD_DIR="/data/adb/modules/twk_nethunter_adapters/system/vendor/lib/modules"
        
        insmod $MOD_DIR/mac80211.ko
        insmod $MOD_DIR/cfg80211.ko
        
        insmod $MOD_DIR/mt76.ko
        insmod $MOD_DIR/mt76-usb.ko
        insmod $MOD_DIR/mt76x02-lib.ko
        insmod $MOD_DIR/mt76x02-usb.ko
        insmod $MOD_DIR/mt76x2-common.ko
        insmod $MOD_DIR/mt76x2u.ko
        
        insmod $MOD_DIR/8812au.ko
        
        insmod $MOD_DIR/btintel.ko
        insmod $MOD_DIR/btrtl.ko
        insmod $MOD_DIR/btusb.ko
        EOF
        
        chmod +x kernelsu_overlay/service.sh

    - name: Force Build & Bypass Prebuilt Google Cache
      run: |
        cd workspace
        
        find private/devices/google -type f -name "*.bzl" -exec sed -i '/gki_prebuilt_fips140/d' {} +
        find private/devices/google -type f -name "BUILD.bazel" -exec sed -i '/download_fips140/d' {} +
        
        # Force a pure from-source compile natively handling KernelSU versioning
        export KSU_GIT_VERSION_VALID=1
        
        ./build_shusky.sh \
          --kernel_package=@//aosp \
          --//build/kernel/kleaf:use_prebuilt_gki=false \
          --no//private/devices/google/common:download_prebuilt_gki_fips140 \
          --notrim \
          --nokmi_symbol_list_strict_mode \
          --//build/kernel/kleaf:kbuild_build_user=Tweaker \
          --//build/kernel/kleaf:kbuild_build_host=twk.v1.25

    - name: Package AK3 Boot Zip
      run: |
        cd workspace
        
        git clone https://github.com/stoag/AnyKernel3-Pixel8Pro.git AnyKernel3
        
        wget -qO AnyKernel3/tools/busybox https://raw.githubusercontent.com/xerta555/Busybox-Binaries/master/busybox-arm64
        chmod +x AnyKernel3/tools/busybox
        wget -qO magisk.zip https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
        unzip -j magisk.zip lib/arm64-v8a/libmagiskboot.so
        mv libmagiskboot.so AnyKernel3/tools/magiskboot
        chmod +x AnyKernel3/tools/magiskboot
        rm magisk.zip
        
        cp out/shusky/dist/Image.lz4 AnyKernel3/
        
        sed -i "s/kernel.string=.*/kernel.string=Tweaker Kernel (${{ env.CUSTOM_KERNEL_VERSION }})/g" AnyKernel3/anykernel.sh
        
        cd AnyKernel3
        zip -r9 ../Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-AK3-Boot.zip * -x README.md
        cd ..

    - name: Package Raw Drivers
      run: |
        cd workspace
        mkdir -p Raw-Drivers
        
        cp out/shusky/dist/mac80211.ko Raw-Drivers/ || true
        cp out/shusky/dist/cfg80211.ko Raw-Drivers/ || true
        cp out/shusky/dist/mt76.ko Raw-Drivers/ || true
        cp out/shusky/dist/mt76-usb.ko Raw-Drivers/ || true
        cp out/shusky/dist/mt76x02-lib.ko Raw-Drivers/ || true
        cp out/shusky/dist/mt76x02-usb.ko Raw-Drivers/ || true
        cp out/shusky/dist/mt76x2-common.ko Raw-Drivers/ || true
        cp out/shusky/dist/mt76x2u.ko Raw-Drivers/ || true
        cp out/shusky/dist/8812au.ko Raw-Drivers/ || true
        cp out/shusky/dist/btintel.ko Raw-Drivers/ || true
        cp out/shusky/dist/btrtl.ko Raw-Drivers/ || true
        cp out/shusky/dist/btusb.ko Raw-Drivers/ || true
        
        cd Raw-Drivers
        zip -r9 ../Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-Raw-Drivers.zip *
        cd ..

    - name: Package NetHunter KSU Module
      run: |
        cd workspace
        
        cp out/shusky/dist/mac80211.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/cfg80211.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/mt76.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/mt76-usb.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/mt76x02-lib.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/mt76x02-usb.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/mt76x2-common.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/mt76x2u.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/8812au.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/btintel.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/btrtl.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        cp out/shusky/dist/btusb.ko kernelsu_overlay/system/vendor/lib/modules/ || true
        
        mkdir -p kernelsu_overlay/system/vendor/firmware/mediatek
        cp private/devices/google/shusky/vendor_dlkm/firmware/mediatek/mt7662_rom_patch.bin kernelsu_overlay/system/vendor/firmware/mediatek/ || true
        cp private/devices/google/shusky/vendor_dlkm/firmware/mediatek/mt7662.bin kernelsu_overlay/system/vendor/firmware/mediatek/ || true
        cp private/devices/google/shusky/vendor_dlkm/firmware/mediatek/mt7662u_rom_patch.bin kernelsu_overlay/system/vendor/firmware/mediatek/ || true
        cp private/devices/google/shusky/vendor_dlkm/firmware/mediatek/mt7662u.bin kernelsu_overlay/system/vendor/firmware/mediatek/ || true
        cp private/devices/google/shusky/vendor_dlkm/firmware/rt2870.bin kernelsu_overlay/system/vendor/firmware/ || true
        
        cat << 'EOF' > kernelsu_overlay/module.prop
        id=twk_nethunter_adapters
        name=Tweaker Kernel NetHunter Adapters
        version=v${{ env.CUSTOM_KERNEL_VERSION }}
        versionCode=1
        author=Tweaker
        description=Injects MediaTek MT76 & Realtek 8812AU modules for NetHunter into the GKI kernel on boot.
        EOF
        
        cd kernelsu_overlay
        zip -r9 ../Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-NetHunter-Modules.zip *
        cd ..

    - name: Upload AK3 Boot Zip
      uses: actions/upload-artifact@v4
      with:
        name: Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-AK3-Boot
        path: workspace/Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-AK3-Boot.zip

    - name: Upload Raw Drivers
      uses: actions/upload-artifact@v4
      with:
        name: Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-Raw-Drivers
        path: workspace/Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-Raw-Drivers.zip

    - name: Upload NetHunter KSU Modules Zip
      uses: actions/upload-artifact@v4
      with:
        name: Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-NetHunter-Modules
        path: workspace/Tweaker-Kernel-${{ env.CUSTOM_KERNEL_VERSION }}-NetHunter-Modules.zip
