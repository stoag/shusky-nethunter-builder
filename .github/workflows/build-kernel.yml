- name: Inject Morrownr Linux 6.1-Ready Driver
      run: |        
        cd workspace/aosp                
        
        chmod u+w drivers/net/wireless/realtek/Makefile                
        
        # Clean out any native nested directories
        rm -rf drivers/net/wireless/realtek/rtw88
        rm -rf drivers/net/wireless/realtek/rtl8812au
        
        # Bring back the dummy rtw88 Kconfig so the parent directory doesn't panic
        mkdir -p drivers/net/wireless/realtek/rtw88
        touch drivers/net/wireless/realtek/rtw88/Kconfig
        
        # Clone YOUR specific fork of the repository
        git clone https://github.com/stoag/8812au-20210820.git drivers/net/wireless/realtek/rtl8812au
        
        # Delete the .git folder so Bazel tracks it cleanly
        rm -rf drivers/net/wireless/realtek/rtl8812au/.git
        
        # Disable Clang CFI and Shadow Call Stack for legacy Realtek signatures
        echo 'ccflags-y += -fno-sanitize=cfi -fno-sanitize=shadow-call-stack' >> drivers/net/wireless/realtek/rtl8812au/Makefile
        
        # Force Kbuild to step into our out-of-tree driver directory
        echo 'obj-y += rtl8812au/' >> drivers/net/wireless/realtek/Makefile
        
        # Bypass Kconfig entirely by hardcoding the module build target to the bottom
        echo 'obj-m := $(MODULE_NAME).o' >> drivers/net/wireless/realtek/rtl8812au/Makefile
