name: Build Custom Pixel 8 Pro Kernel (KSUN + Drivers)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget curl ccache python3
          
          # Install Google's repo tool so source synchronization succeeds
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Bazel / Kleaf Build Tooling
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc)
          echo "Initializing Bazel toolchain..."

      - name: Integrate Upstream KernelSU-Next (Pure Built-In) & Wireless Drivers
        run: |
          # 1. Clone Official Upstream KernelSU-Next (No SuSFS)
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next

          # --- DYNAMIC VERSION INJECTION ---
          cd KernelSU-Next
          KSUN_TAG=$(git describe --tags --abbrev=0)
          KSUN_COMMITS=$(git rev-list --count HEAD)
          cd ..

          echo "Detected KSUN Version: $KSUN_TAG (Commits: $KSUN_COMMITS)"

          # Copy directly into the common kernel tree paths
          cp -r KernelSU-Next/kernel common/drivers/kernelsu
          echo 'obj-y += kernelsu/' >> common/drivers/Makefile
          sed -i '/source "drivers\/misc\/Kconfig"/a source "drivers\/kernelsu\/Kconfig"' common/drivers/Kconfig

          # The Bazel Bypass for version variables
          for KFILE in common/drivers/kernelsu/Makefile common/drivers/kernelsu/Kbuild; do
              if [ -f "$KFILE" ]; then
                  sed -i "1i KSU_GIT_VERSION := $KSUN_COMMITS" "$KFILE"
                  sed -i "2i KSU_GIT_TAG := $KSUN_TAG" "$KFILE"
                  sed -i "3i KSU_GIT_VERSION_VALID := 1" "$KFILE"
              fi
          done

      - name: Apply Defconfig Configurations
        run: |
          # 3. Append Configs (NetHunter Wireless, MT76, 8812AU, Pure KSUN - NO SuSFS)
          {
            echo '# Custom Kernel Signature'
            echo 'CONFIG_LOCALVERSION="-twk.v1.20"'

            echo '# Core Wireless Subsystems'
            echo 'CONFIG_CFG80211=y'
            echo 'CONFIG_MAC80211=y'
            echo 'CONFIG_CFG80211_CERTIFICATION_ONUS=y'
            echo 'CONFIG_WIRELESS=y'
            
            echo '# NATIVE: MediaTek MT7612U (Panda PAU0D)'
            echo 'CONFIG_WLAN_VENDOR_MEDIATEK=y'
            echo 'CONFIG_MT76_CORE=y'
            echo 'CONFIG_MT76_USB=y'
            echo 'CONFIG_MT76x02_LIB=y'
            echo 'CONFIG_MT76x02_USB=y'
            echo 'CONFIG_MT76x2_COMMON=y'
            echo 'CONFIG_MT76x2U=y'
            
            echo '# MODULE: Realtek RTL8812AU'
            echo 'CONFIG_WLAN_VENDOR_REALTEK=y'
            echo 'CONFIG_RTW88=n'
            echo 'CONFIG_RTW88_CORE=n'
            echo 'CONFIG_RTW88_USB=n'
            echo 'CONFIG_RTL8812AU=m'

            echo '# Inline KernelSU-Next (Built-in Mode)'
            echo 'CONFIG_KSU=y'
            echo 'CONFIG_TRIM_NONLISTED_KMI=n'
            
            echo '# USB ConfigFS & HID Arsenal'
            echo 'CONFIG_CONFIGFS_FS=y'
            echo 'CONFIG_USB_CONFIGFS=y'
            echo 'CONFIG_USB_GADGETFS=y'
            echo 'CONFIG_USB_CONFIGFS_F_HID=y'
            echo 'CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y'
            echo 'CONFIG_USB_CONFIGFS_F_ECM=y'
            echo 'CONFIG_USB_CONFIGFS_F_ACM=y'
            echo 'CONFIG_USB_CONFIGFS_RNDIS=y'
            echo 'CONFIG_USB_CONFIGFS_NCM=y'
            
            echo '# AFWall+ & Netfilter Logging'
            echo 'CONFIG_NETFILTER_NETLINK_LOG=y'
            echo 'CONFIG_NETFILTER_NETLINK_QUEUE=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_LOG=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_NFLOG=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_OWNER=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_STATE=y'
            echo 'CONFIG_NETFILTER_XT_MATCH_MATCH_MARK=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_MARK=y'
            
            echo '# NAT & WireGuard'
            echo 'CONFIG_IP_NF_NAT=y'
            echo 'CONFIG_IP6_NF_NAT=y'
            echo 'CONFIG_IP_NF_MANGLE=y'
            echo 'CONFIG_IP6_NF_MANGLE=y'
            echo 'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y'
            echo 'CONFIG_WIREGUARD=y'
            
            echo 'CONFIG_BT_HCIBTUSB=m'
          } >> common/arch/arm64/configs/gki_defconfig

      - name: Compile Kernel via Bazel
        run: |
          tools/bazel run //private/devices/google/shusky:kernel_ui_extras -- //dev:build_pixel_kernel

      - name: Package Artifacts (AnyKernel3)
        uses: actions/upload-artifact@v4
        with:
          name: twk-v1.20-release-package
          path: |
            out/
            AnyKernel3/

      - name: Send Completion Notification Ping
        if: always()
        run: |
          echo "Build finished! Sending completion ping..."
