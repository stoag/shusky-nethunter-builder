          #  echo 'echo "insmod /dev/twk_modules/8812au.ko rtw_drv_log_level=6 rtw_power_mgnt=0 rtw_switch_usb_mode=0 >> \$LOG 2>&1 || true" >> $MOD_DIR/service.sh'
          #  echo 'echo "echo -n \"\" > /sys/module/firmware_class/parameters/path" >> $MOD_DIR/service.sh'
          #  echo 'chmod +x $MOD_DIR/service.sh'
          #  echo 'ui_print "- Adapters staged successfully (no /vendor shadowing)!";'
          # } >> AnyKernel3/anykernel.sh
          #
          
          cd AnyKernel3
          zip -r9 ../bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-anykernel3.zip * -x README.md
          cd ..

          #for part in vendor_dlkm.img vendor_kernel_boot.img system_dlkm.img; do
          #  if [ -f "out/shusky/dist/$part" ]; then
          #    cp -L "out/shusky/dist/$part" "bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-$part"
          #  else
          #    SRC=$(find out/ -type f -name "$part" | head -n 1)
          #    cp -L "$SRC" "bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-$part"
          #  fi
          #done

          find out/ -type f \( -name "init_boot.img" -o -name "boot.img" \) -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-init_boot.img \;
          find out/ -type f -name "vendor_dlkm.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-vendor_dlkm.img \;
          find out/ -type f -name "vendor_kernel_boot.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-vendor_kernel_boot.img \;
          find out/ -type f -name "system_dlkm.img" -exec cp -L {} bundle/twk-v${{ env.CUSTOM_KERNEL_VERSION }}-system_dlkm.img \;
          
          echo "VERIFYING FLAT BUNDLE CONTENTS:"
          ls -lh bundle/

      - name: Upload Complete Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Tweaker-Kernel-v${{ env.CUSTOM_KERNEL_VERSION }}-Bundle
          path: workspace/bundle/*
          if-no-files-found: error

      - name: Ping Phone - Success
        if: success()
        run: curl -d "✅ Pixel 8 Pro Kernel v${{ env.CUSTOM_KERNEL_VERSION }} Build COMPLETE!" https://ntfy.sh/twk_pixel8_build_alerts

      - name: Ping Phone - Failure
        if: failure()
        run: curl -d "❌ Pixel 8 Pro Kernel v${{ env.CUSTOM_KERNEL_VERSION }} Build FAILED! Check the logs." https://ntfy.sh/twk_pixel8_build_alerts
